; Top 20 Processes - Black & White
; Top 20 CPU processes display in minimal black & white style
; ----------------------------------

[Rainmeter]
Update=2000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,220

[Metadata]
Name=Top 20 Processes - Black & White
Author=Rainmast4r
Information=Top 20 CPU consuming processes
Version=1.0.0

[Variables]
fontName=Consolas
textSize=10
colorText=255,255,255,255
colorLabel=200,200,200,255
colorHeader=255,255,255,255

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
FontColor=#colorText#
FontFace=#fontName#
FontSize=14
AntiAlias=1

[styleHeader]
StringAlign=Center
StringStyle=Bold
FontColor=#colorHeader#
FontFace=#fontName#
FontSize=9
AntiAlias=1

[styleProcess]
StringAlign=Left
StringStyle=Normal
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Normal
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=15,15,15,60
X=0
Y=0
W=380
H=320
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=190
Y=8
W=380
Text=TOP 20 PROCESSES

[meterColHeader1]
Meter=String
MeterStyle=styleHeader
X=10
Y=32
W=280
Text=PROCESS

[meterColHeader2]
Meter=String
MeterStyle=styleHeader
X=300
Y=32
W=70
Text=CPU %

[meterDivider1]
Meter=Image
SolidColor=100,100,100,100
X=10
Y=46
W=360
H=1

[meterNote]
Meter=String
MeterStyle=styleProcess
X=10
Y=55
W=360
Text=Top processes by CPU usage
FontSize=8
FontColor=150,150,150,255
