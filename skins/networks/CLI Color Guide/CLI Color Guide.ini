; CLI Color Guide Skin
; Terminal color reference for standard CLI theming
; ----------------------------------

[Rainmeter]
Update=5000
DynamicWindowSize=1
AccurateText=1
SolidColor=10,10,10,220

[Metadata]
Name=CLI Color Guide
Author=Rainmast4r
Information=CLI color reference — Websites, Apps, Extensions
Version=1.0.0

[Variables]
fontName=Consolas
textSize=11
colorTitle=220,220,220,255
colorLabel=180,180,180,255

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
FontColor=#colorTitle#
FontFace=#fontName#
FontSize=16
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Normal
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleSwatch]
StringAlign=Center
StringStyle=Bold
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=10
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=15,15,15,60
X=0
Y=0
W=280
H=155
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=CLI COLOR GUIDE

[meterLabel1]
Meter=String
MeterStyle=styleLabel
X=10
Y=40
W=150
Text=WEBSITES:

[meterSwatch1]
Meter=Image
SolidColor=66,165,245,255
X=170
Y=35
W=100
H=30
ToolTipText=Blue - #0099FF

[meterLabel2]
Meter=String
MeterStyle=styleLabel
X=10
Y=75
W=150
Text=APPS:

[meterSwatch2]
Meter=Image
SolidColor=255,152,0,255
X=170
Y=70
W=100
H=30
ToolTipText=Orange - #FF9800

[meterLabel3]
Meter=String
MeterStyle=styleLabel
X=10
Y=110
W=150
Text=EXTENSIONS:

[meterSwatch3]
Meter=Image
SolidColor=255,235,59,255
X=170
Y=105
W=100
H=30
ToolTipText=Yellow - #FFEB3B



