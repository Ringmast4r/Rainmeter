; Uptime - Black & White
; System uptime display in minimal black & white style
; ----------------------------------

[Rainmeter]
Update=60000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,220

[Metadata]
Name=Uptime - Black & White
Author=Rainmast4r
Information=System uptime display
Version=1.0.0

[Variables]
fontName=Consolas
textSize=12
colorText=255,255,255,255
colorLabel=200,200,200,255

; ==================================
; MEASURES
; ==================================

[measureUptime]
Measure=Uptime
Format=%4!i!d %3!i!h %2!i!m

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
FontColor=#colorText#
FontFace=#fontName#
FontSize=16
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Normal
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=15,15,15,60
X=0
Y=0
W=280
H=100
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=UPTIME

[meterLabel]
Meter=String
MeterStyle=styleLabel
X=10
Y=40
W=150
Text=System:

[meterValue]
Meter=String
MeterStyle=styleValue
MeasureName=measureUptime
X=270
Y=40
W=200
Text=%1
