[Rainmeter]
Update=500
MiddleMouseUpAction=[!Refresh]
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Dark - System Info
Author=Anonymous
Version=2.1

[Variables]
FontMain=Lato
FontLight=Lato Light
ColorText=255,255,255,255
ColorSub=255,255,255,200
ColorTrack=255,255,255,100
ColorAccent=0,188,212,255
ColorRed=255,50,50,255

[mCPU]
Measure=CPU
UpdateDivider=1
MinValue=0
MaxValue=100
IfCondition=(mCPU > 85)
IfTrueAction=[!SetOption RlCPU_Fill LineColor "#ColorRed#"][!UpdateMeter RlCPU_Fill][!Redraw]
IfFalseAction=[!SetOption RlCPU_Fill LineColor "#ColorAccent#"][!UpdateMeter RlCPU_Fill][!Redraw]

[mRAM]
Measure=PhysicalMemory
UpdateDivider=1

[Background]
Meter=Shape
Shape=Rectangle 0,0,275,150 | StrokeWidth 0 | Fill Color 24,24,24

; ===== CPU ring (center 75,76) =====
[RlCPU_Track]
Meter=RoundLine
X=25
Y=26
W=100
H=100
LineColor=#ColorTrack#
LineWidth=1
LineLength=50
LineStart=47.5
Solid=1
AntiAlias=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))

[RlCPU_Fill]
MeasureName=mCPU
Meter=RoundLine
X=24
Y=25
W=102
H=102
LineColor=#ColorAccent#
LineWidth=1
LineLength=51
LineStart=47
Solid=1
AntiAlias=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))

[TextCPU_Val]
Meter=String
MeasureName=mCPU
X=75
Y=60
FontFace=#FontMain#
FontSize=20
FontColor=#ColorText#
StringAlign=Center
AntiAlias=1
NumOfDecimals=0
Text=%1%

[TextCPU_Lbl]
Meter=String
X=75
Y=132
FontFace=#FontLight#
FontSize=12
FontColor=#ColorSub#
StringAlign=Center
AntiAlias=1
Text=CPU

; ===== RAM ring (center 200,76) =====
[RlRAM_Track]
Meter=RoundLine
X=150
Y=26
W=100
H=100
LineColor=#ColorTrack#
LineWidth=1
LineLength=50
LineStart=47.5
Solid=1
AntiAlias=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))

[RlRAM_Fill]
MeasureName=mRAM
Meter=RoundLine
X=149
Y=25
W=102
H=102
LineColor=#ColorAccent#
LineWidth=1
LineLength=51
LineStart=47
Solid=1
AntiAlias=1
DynamicVariables=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))

[TextRAM_Val]
Meter=String
MeasureName=mRAM
X=200
Y=60
FontFace=#FontMain#
FontSize=20
FontColor=#ColorText#
StringAlign=Center
AntiAlias=1
NumOfDecimals=1
Percentual=1
Text=%1%

[TextRAM_Lbl]
Meter=String
X=200
Y=132
FontFace=#FontLight#
FontSize=12
FontColor=#ColorSub#
StringAlign=Center
AntiAlias=1
Text=RAM


