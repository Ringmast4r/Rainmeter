; ============================================================
;  DERIVED - peak rain chance, drives the colour coding
; ============================================================
[mRainMorn]
Measure=Calc
Formula=Max(mR06,mR09)
MinValue=0
MaxValue=100
IfCondition=(mRainMorn < 25)
IfTrueAction=[!SetOption MeterMornVal FontColor "#ColorSub#"][!UpdateMeter MeterMornVal][!Redraw]
IfCondition2=((mRainMorn >= 25) && (mRainMorn < 50))
IfTrueAction2=[!SetOption MeterMornVal FontColor "#ColorMaybe#"][!UpdateMeter MeterMornVal][!Redraw]
IfCondition3=(mRainMorn >= 50)
IfTrueAction3=[!SetOption MeterMornVal FontColor "#ColorWet#"][!UpdateMeter MeterMornVal][!Redraw]

[mRainAftn]
Measure=Calc
Formula=Max(mR12,mR15)
MinValue=0
MaxValue=100
IfCondition=(mRainAftn < 25)
IfTrueAction=[!SetOption MeterAftnVal FontColor "#ColorSub#"][!UpdateMeter MeterAftnVal][!Redraw]
IfCondition2=((mRainAftn >= 25) && (mRainAftn < 50))
IfTrueAction2=[!SetOption MeterAftnVal FontColor "#ColorMaybe#"][!UpdateMeter MeterAftnVal][!Redraw]
IfCondition3=(mRainAftn >= 50)
IfTrueAction3=[!SetOption MeterAftnVal FontColor "#ColorWet#"][!UpdateMeter MeterAftnVal][!Redraw]

[mRainEve]
Measure=Calc
Formula=Max(mR18,mR21)
MinValue=0
MaxValue=100
IfCondition=(mRainEve < 25)
IfTrueAction=[!SetOption MeterEveVal FontColor "#ColorSub#"][!UpdateMeter MeterEveVal][!Redraw]
IfCondition2=((mRainEve >= 25) && (mRainEve < 50))
IfTrueAction2=[!SetOption MeterEveVal FontColor "#ColorMaybe#"][!UpdateMeter MeterEveVal][!Redraw]
IfCondition3=(mRainEve >= 50)
IfTrueAction3=[!SetOption MeterEveVal FontColor "#ColorWet#"][!UpdateMeter MeterEveVal][!Redraw]

[mRainMax]
Measure=Calc
Formula=Max(Max(mR00,mR03),Max(Max(mR06,mR09),Max(Max(mR12,mR15),Max(mR18,mR21))))
MinValue=0
MaxValue=100
IfCondition=(mRainMax < 30)
IfTrueAction=[!SetOption MeterRainWord Text "STAYING DRY"][!SetOption MeterRainWord FontColor "#ColorDry#"][!SetOption MeterRainPct FontColor "#ColorDry#"][!SetOption MeterRainBar BarColor "#ColorDry#"][!UpdateMeter *][!Redraw]
IfCondition2=((mRainMax >= 30) && (mRainMax < 60))
IfTrueAction2=[!SetOption MeterRainWord Text "RAIN POSSIBLE"][!SetOption MeterRainWord FontColor "#ColorMaybe#"][!SetOption MeterRainPct FontColor "#ColorMaybe#"][!SetOption MeterRainBar BarColor "#ColorMaybe#"][!UpdateMeter *][!Redraw]
IfCondition3=(mRainMax >= 60)
IfTrueAction3=[!SetOption MeterRainWord Text "RAIN LIKELY"][!SetOption MeterRainWord FontColor "#ColorWet#"][!SetOption MeterRainPct FontColor "#ColorWet#"][!SetOption MeterRainBar BarColor "#ColorWet#"][!UpdateMeter *][!Redraw]

[mRainTmrw]
Measure=Calc
Formula=Max(Max(mT00,mT03),Max(Max(mT06,mT09),Max(Max(mT12,mT15),Max(mT18,mT21))))
MinValue=0
MaxValue=100
IfCondition=(mRainTmrw < 30)
IfTrueAction=[!SetOption MeterTmrwRain FontColor "#ColorDry#"][!UpdateMeter MeterTmrwRain][!Redraw]
IfCondition2=((mRainTmrw >= 30) && (mRainTmrw < 60))
IfTrueAction2=[!SetOption MeterTmrwRain FontColor "#ColorMaybe#"][!UpdateMeter MeterTmrwRain][!Redraw]
IfCondition3=(mRainTmrw >= 60)
IfTrueAction3=[!SetOption MeterTmrwRain FontColor "#ColorWet#"][!UpdateMeter MeterTmrwRain][!Redraw]

[mDate]
Measure=Time
Format=%A, %d %b

