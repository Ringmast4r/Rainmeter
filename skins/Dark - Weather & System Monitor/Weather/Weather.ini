[Rainmeter]
Update=1000
MiddleMouseUpAction=[!Refresh]
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Dark - Weather
Author=Anonymous
Version=3.0
Information=Current conditions plus a rain outlook for today and tomorrow. Data from wttr.in, no API key required.

[Variables]
Zip=10001
City=New York, NY
FontMain=Lato
FontLight=Lato Light
ColorText=255,255,255,255
ColorSub=255,255,255,200
ColorDim=120,124,140,255
ColorBar=47,100,170,255
ColorTeal=0,188,212,255
ColorTrack=255,255,255,40
ColorLine=40,44,54,255
ColorDry=76,200,120,255
ColorMaybe=255,193,7,255
ColorWet=255,82,82,255

; ============================================================
;  DATA - wttr.in JSON feed, one download, 34 capture groups
; ============================================================
[mWeather]
Measure=Plugin
Plugin=WebParser
URL=https://wttr.in/#Zip#?format=j1
UpdateDivider=1800
RegExp=(?siU)"FeelsLikeF": "(.*)".*"cloudcover": "(.*)".*"humidity": "(.*)".*"temp_F": "(.*)".*"uvIndex": "(.*)".*"weatherDesc": \[.*"value": "(.*)".*"winddir16Point": "(.*)".*"windspeedMiles": "(.*)".*"sunrise": "(.*)".*"sunset": "(.*)".*"date": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"maxtempF": "(.*)".*"mintempF": "(.*)".*"uvIndex": "(.*)".*"date": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"weatherDesc": \[.*"value": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"chanceofrain": "(.*)".*"maxtempF": "(.*)".*"mintempF": "(.*)"

; ----- current conditions -----
[mFeelsF]
Measure=Plugin
Plugin=WebParser
URL=[mWeather]
StringIndex=1

