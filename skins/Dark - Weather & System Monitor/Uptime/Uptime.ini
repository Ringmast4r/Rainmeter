[Rainmeter]
Update=1000
MiddleMouseUpAction=[!Refresh]
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Dark - Uptime
Author=Anonymous
Version=1.2

[Variables]
FontMain=Lato
FontLight=Lato Light
ColorText=255,255,255,255
ColorTeal=0,188,212,255
ColorDim=120,124,140,255
ColorBar=47,100,170,255

[mUptimeSec]
Measure=UpTime

[mDays]
Measure=Calc
Formula=floor(mUptimeSec / 86400)

[mHours]
Measure=Calc
Formula=floor(mUptimeSec / 3600) - (floor(mUptimeSec / 86400) * 24)

[mMinutes]
Measure=Calc
Formula=floor(mUptimeSec / 60) - (floor(mUptimeSec / 3600) * 60)

[mSeconds]
Measure=Calc
Formula=mUptimeSec - (floor(mUptimeSec / 60) * 60)

[Background]
Meter=Shape
Shape=Rectangle 0,0,275,142 | StrokeWidth 0 | Fill Color 24,24,24

[BarTitle]
Meter=Shape
Shape=Rectangle 0,0,275,50 | StrokeWidth 0 | Fill Color #ColorBar#

[MeterTitle]
Meter=String
X=137
Y=14
FontFace=#FontMain#
FontSize=14
FontColor=#ColorText#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
Text=UPTIME | PC-Q

[MeterDaysVal]
Meter=String
MeasureName=mDays
X=55
Y=64
FontFace=#FontMain#
FontSize=22
FontColor=#ColorTeal#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
NumOfDecimals=0
Text=%1

[MeterDaysLbl]
Meter=String
X=55
Y=96
FontFace=#FontLight#
FontSize=8
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=DAYS

[MeterHoursVal]
Meter=String
MeasureName=mHours
X=110
Y=64
FontFace=#FontMain#
FontSize=22
FontColor=#ColorText#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
NumOfDecimals=0
Text=%1

[MeterHoursLbl]
Meter=String
X=110
Y=96
FontFace=#FontLight#
FontSize=8
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=HRS

[MeterMinutesVal]
Meter=String
MeasureName=mMinutes
X=165
Y=64
FontFace=#FontMain#
FontSize=22
FontColor=#ColorText#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
NumOfDecimals=0
Text=%1

[MeterMinutesLbl]
Meter=String
X=165
Y=96
FontFace=#FontLight#
FontSize=8
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=MIN

[MeterSecondsVal]
Meter=String
MeasureName=mSeconds
X=220
Y=64
FontFace=#FontMain#
FontSize=22
FontColor=#ColorText#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
NumOfDecimals=0
Text=%1

[MeterSecondsLbl]
Meter=String
X=220
Y=96
FontFace=#FontLight#
FontSize=8
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=SEC

[MeterDivider2]
Meter=Shape
Shape=Line 8,118,267,118 | StrokeWidth 1 | Stroke Color 40,44,54,255

[MeterFooter]
Meter=String
X=137
Y=122
FontFace=#FontLight#
FontSize=8
FontColor=#ColorDim#
StringAlign=Center
AntiAlias=1
Text=PC-Q system uptime


