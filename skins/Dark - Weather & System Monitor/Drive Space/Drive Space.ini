[Rainmeter]
Update=500
MiddleMouseUpAction=[!Refresh]
BackgroundMode=2
SolidColor=0,0,0,1

[Metadata]
Name=Dark - Drive Space
Author=Anonymous
Information=Self-remapping drive gauges - live drives pack into slots via @DriveData task
Version=4.1

[Variables]
ColorTeal=0,150,136,255
ColorTrack=255,255,255,100
ColorText=255,255,255,255
ColorSub=255,255,255,200
ColorSize=200,204,214,255
FontMain=Segoe UI
FontLight=Segoe UI Light
@IncludeDriveData=#SKINSPATH#@DriveData\DriveData.inc

; ============================================================
; MEASURES (all local - drive data comes from the .inc)
; ============================================================

[mUptimeSec]
Measure=UpTime
UpdateDivider=2

[mUDays]
Measure=Calc
Formula=floor(mUptimeSec / 86400)
UpdateDivider=2

[mUHours]
Measure=Calc
Formula=floor(mUptimeSec / 3600) - (floor(mUptimeSec / 86400) * 24)
UpdateDivider=2

[mUMinutes]
Measure=Calc
Formula=floor(mUptimeSec / 60) - (floor(mUptimeSec / 3600) * 60)
UpdateDivider=2

[mUSeconds]
Measure=Calc
Formula=mUptimeSec - (floor(mUptimeSec / 60) * 60)
UpdateDivider=2

[mCPU]
Measure=CPU
UpdateDivider=1
MinValue=0
MaxValue=100
IfCondition=(mCPU >= 85)
IfTrueAction=[!SetOption RlCPU_Fill LineColor "255,50,50,255"][!UpdateMeter RlCPU_Fill][!Redraw]
IfFalseAction=[!SetOption RlCPU_Fill LineColor "0,150,136,255"][!UpdateMeter RlCPU_Fill][!Redraw]

[mRAM]
Measure=PhysicalMemory
UpdateDivider=1

[mSwap]
Measure=SwapMemory
UpdateDivider=1

[mRecycleSize]
Measure=Plugin
Plugin=RecycleManager
Type=Size
UpdateDivider=10

[mRecyclePct]
Measure=Calc
Formula=(mRecycleSize > 0) ? min(mRecycleSize / 10737418240 * 100, 100) : 0
MinValue=0
MaxValue=100

[mSlot1]
Measure=Calc
Formula=#Slot1_Pct#
MinValue=0
MaxValue=100

[mSlot2]
Measure=Calc
Formula=#Slot2_Pct#
MinValue=0
MaxValue=100

[mSlot3]
Measure=Calc
Formula=#Slot3_Pct#
MinValue=0
MaxValue=100

[mSlot4]
Measure=Calc
Formula=#Slot4_Pct#
MinValue=0
MaxValue=100

[mSlot5]
Measure=Calc
Formula=#Slot5_Pct#
MinValue=0
MaxValue=100

[mSlot6]
Measure=Calc
Formula=#Slot6_Pct#
MinValue=0
MaxValue=100

[mSlot7]
Measure=Calc
Formula=#Slot7_Pct#
MinValue=0
MaxValue=100

[mSlot8]
Measure=Calc
Formula=#Slot8_Pct#
MinValue=0
MaxValue=100

[mSlot9]
Measure=Calc
Formula=#Slot9_Pct#
MinValue=0
MaxValue=100

[mSlot10]
Measure=Calc
Formula=#Slot10_Pct#
MinValue=0
MaxValue=100

[mSlot11]
Measure=Calc
