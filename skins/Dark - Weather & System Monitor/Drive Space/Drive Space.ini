Formula=#Slot13_Pct#
MinValue=0
MaxValue=100

; ============================================================
; BACKGROUND + TITLE + UPTIME
; ============================================================

[Background]
Meter=Shape
Shape=Rectangle 0,0,580,#BgH# | StrokeWidth 0 | Fill Color 18,18,18
LeftMouseUpAction=["explorer.exe" "shell:MyComputerFolder"]

[MeterTitle]
Meter=String
X=290
Y=14
FontFace=#FontMain#
FontSize=13
FontColor=#ColorText#
StringStyle=Bold
StringAlign=Center
AntiAlias=1
Text=DRIVE SPACE

[MeterTitleSub]
Meter=String
X=290
Y=34
FontFace=#FontLight#
FontSize=9
FontColor=#ColorSub#
StringAlign=Center
AntiAlias=1
Text=#LiveCount# drives online - click a gauge to open

[MeterUDaysVal]
Meter=String
MeasureName=mUDays
X=22
Y=8
FontFace=#FontMain#
FontSize=16
FontColor=#ColorTeal#
StringStyle=Bold
StringAlign=Center
