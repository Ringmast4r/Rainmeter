; --- Slot 1 ---
[RlSlot1_Track]
Meter=RoundLine
X=#Slot1_X#
Y=#Slot1_Y#
W=100
H=100
LineColor=#ColorTrack#
LineWidth=1
LineLength=50
LineStart=47.5
Solid=1
AntiAlias=1
StartAngle=(Rad(270))
RotationAngle=(Rad(360))
Hidden=#Slot1_Hidden#

[RlSlot1_Fill]
