; Net // Works Sites up card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
MouseScrollUpAction=[!CommandMeasure mScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure mScript "Scroll(1)"]
ContextTitle=Check now
ContextAction=[!CommandMeasure mRun "Run"]
ContextTitle2=Edit the site list
ContextAction2=["#@#Local\sites.txt"]

[Metadata]
Name=Net // Works Sites up
Author=ringmast4r
Information=Status code and response time for every site in @Resources\Local\sites.txt, checked in parallel once a minute. Worst first: down, error, then slowest. Scroll for the rest of a long list. Click a row to open the site.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\Sites.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Sites.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,437,485 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,404,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,456,404,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Sites up

[MHint]
Meter=String
MeterStyle=sCap
X=136
Y=18
Text=// http status, worst first

[MToggle]
Meter=String
MeterStyle=sBtn
X=416
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=466
Text=starting...

[MStatusBox]
Meter=Shape
Shape=Rectangle 19,51,402,46 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cMid#

[MStatusCap]
