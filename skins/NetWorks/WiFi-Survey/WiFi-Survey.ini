; Net // Works Wi-Fi survey card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
ContextTitle=Scan now
ContextAction=[!CommandMeasure mRun "Run"]

[Metadata]
Name=Net // Works Wi-Fi survey
Author=ringmast4r
Information=Every Wi-Fi network in range: name, access point vendor (from its BSSID), channel, band, signal and security, plus how crowded each 2.4 and 5 GHz channel is. Asks Windows for a fresh scan each cycle.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\Survey.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Survey.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,597,497 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,564,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,468,564,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Wi-Fi survey

[MHint]
Meter=String
MeterStyle=sCap
X=188
Y=18
Text=// networks in range

[MToggle]
Meter=String
MeterStyle=sBtn
X=576
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=478
Text=starting...

[sTick]
FontFace=#fMono#
FontSize=6
StringStyle=Bold
StringAlign=Center
FontColor=#cMid#
AntiAlias=1

