; Net // Works VPN card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
ContextTitle=Check now
ContextAction=[!CommandMeasure mRun "Run"]

[Metadata]
Name=Net // Works VPN
Author=ringmast4r
Information=Shows which VPN (Proton, Mullvad, Net // Works or another tunnel) is connected and whether it actually carries your traffic.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\VPN.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\VPN.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,437,253 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,404,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,224,404,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=VPN

[MHint]
Meter=String
MeterStyle=sCap
X=71
Y=18
Text=// which tunnel carries your traffic

[MToggle]
Meter=String
MeterStyle=sBtn
X=416
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=234
Text=starting...

[MStatusBox]
Meter=Shape
Shape=Rectangle 19,51,402,46 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cMid#

[MStatusCap]
Meter=String
MeterStyle=sCap
X=28
Y=57
Text=checking...

[MStatusVal]
Meter=String
FontFace=#fMono#
FontSize=13
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
ClipString=1
X=28
Y=70
W=384
H=22
Text=--

[MHeadBar]
