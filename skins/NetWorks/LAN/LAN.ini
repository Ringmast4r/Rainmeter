; Net // Works LAN watch card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
ContextTitle=Sweep now
ContextAction=[!CommandMeasure mSweep "Run"]
ContextTitle2=Name devices
ContextAction2=["#@#Local\lan_names.txt"]

[Metadata]
Name=Net // Works LAN watch
Author=ringmast4r
Information=Every device on your local network from a ping sweep every 5 minutes: address, name, vendor (from its MAC) and when it was first seen. Devices first seen in the last 24 hours turn yellow. Label devices in @Resources\Local\lan_names.txt; Proxmox containers are named by the Homelab card.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\Lan.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mSweep]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\Lan.ps1" -Sweep
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!CommandMeasure mScript "Parse('mSweep')"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Lan.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,597,501 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,564,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,472,564,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=LAN watch

[MHint]
Meter=String
MeterStyle=sCap
X=149
Y=18
Text=// local network

[MToggle]
Meter=String
MeterStyle=sBtn
X=576
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=482
Text=starting...

