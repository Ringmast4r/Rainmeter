; Net // Works Deadlines card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Edit deadlines
ContextAction=["#@#Local\deadlines.txt"]

[Metadata]
Name=Net // Works Deadlines
Author=ringmast4r
Information=Countdown to the dates in @Resources\Local\deadlines.txt (one per line: 2026-10-11 | Name). Yellow inside 30 days, red inside 7.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Deadlines.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,337,307 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,304,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,278,304,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Deadlines

[MHint]
Meter=String
MeterStyle=sCap
X=149
Y=18
Text=// countdown

[MToggle]
Meter=String
MeterStyle=sBtn
X=316
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=288
Text=starting...

