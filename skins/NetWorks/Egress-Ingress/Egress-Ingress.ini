; Net // Works Egress / ingress card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
MouseScrollUpAction=[!CommandMeasure mScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure mScript "Scroll(1)"]
ContextTitle=Check now
ContextAction=[!CommandMeasure mRun "Run"]
ContextTitle2=Set the IP // Revealer path
ContextAction2=["#@#Local\talkers.txt"]
ContextTitle3=Name LAN devices
ContextAction3=["#@#Local\lan_names.txt"]

[Metadata]
Name=Net // Works Egress / ingress
Author=ringmast4r
Information=What is going where: every connection this PC holds, split into outbound (this PC called out) and inbound (something connected in), plus the ports it listens on. Inbound from the internet is red, from the LAN yellow, threat-listed addresses red. Click a box to show only that kind; scroll for the rest. The header is live traffic out and in. Owners come from IP // Revealer (path in @Resources\Local\talkers.txt), LAN names from the LAN and Homelab cards.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\Flows.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mIn]
Measure=NetIn
Interface=Best

[mOut]
Measure=NetOut
Interface=Best

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Flows.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,597,501 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,564,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,472,564,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Egress / ingress

[MHint]
Meter=String
MeterStyle=sCap
X=240
Y=18
Text=// what is going where

[MToggle]
Meter=String
MeterStyle=sBtn
X=576
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=482
Text=starting...

