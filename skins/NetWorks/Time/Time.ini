; Net // Works Local time - "Sin City" house style (monochrome, Courier New, square
; corners, heavy black borders, black highlight blocks). Same size as the Uptime card.
[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=0
ContextTitle=Date and time settings
ContextAction=["ms-settings:dateandtime"]

[Metadata]
Name=Net // Works Local time
Author=ringmast4r
Information=Local time card in the Sin City monochrome house style: day, hours, minutes, seconds, day progress, the full date and UTC. Click the hours box to switch between 12 and 24 hour.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New
; auto = follow the Windows short time format; clicking the hours box sets 12 or 24.
Clock=auto

; ================= styles
[sLabel]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sNum]
FontFace=#fMono#
FontSize=20
StringStyle=Bold
StringAlign=Center
FontColor=#cFg#
AntiAlias=1
Y=57

[sBoxLab]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
StringAlign=Center
FontColor=#cMid#
AntiAlias=1
Y=92

[sValue]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1

; ================= measures
; the Windows short time format: "h:mm tt" is a 12 hour clock, "HH:mm" a 24 hour one
[mShortTime]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Control Panel\International
RegValue=sShortTime
UpdateDivider=20

; value = how far through the day, 0-100, for the bar
[mScript]
Measure=Script
ScriptFile=#@#Scripts\Time.lua
MinValue=0
MaxValue=100

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,337,197 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Local Time

; UTC offset as a black badge (black background, white text)
[MZone]
Meter=String
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
StringAlign=Right
FontColor=#cBg#
SolidColor=#cFg#
Padding=6,3,6,3
AntiAlias=1
X=268
Y=16
Text=

; theme toggle button (label names the mode it switches to)
[MToggle]
Meter=String
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
X=316
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
MouseActionCursorName=Hand
ToolTipText=Switch to #ToggleTo# mode

; ================= stat boxes
[MFrame]
Meter=Shape
; header underline 3px
Shape=Rectangle 18,38,304,3 | Fill Color #cFg# | StrokeWidth 0
; DAY box is the highlight block (black fill)
Shape2=Rectangle 18,50,70,62 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 97,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
Shape4=Rectangle 175,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
Shape5=Rectangle 253,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
; day-progress track
Shape6=Rectangle 18.5,138.5,303,9 | Fill Color #cTrack# | StrokeWidth 1 | Stroke Color #cFg#
; footer rule 2px
Shape7=Rectangle 18,158,304,2 | Fill Color #cFg# | StrokeWidth 0

[MDay]
Meter=String
MeterStyle=sNum
X=53
FontColor=#cBg#
Text=--

[MDayL]
Meter=String
MeterStyle=sBoxLab
X=53
FontColor=#cHiLab#
Text=Day

[MHours]
Meter=String
MeterStyle=sNum
X=131
Text=--

[MHoursL]
Meter=String
MeterStyle=sBoxLab
X=131
Text=Hours

; the hours box switches 12 / 24 hour
[MHoursHit]
Meter=Image
X=97
Y=51
W=68
H=60
SolidColor=0,0,0,1
LeftMouseUpAction=[!CommandMeasure mScript "Clock()"]
MouseActionCursorName=Hand
ToolTipText=Switch between 12 and 24 hour

[MMins]
Meter=String
MeterStyle=sNum
X=209
Text=--

[MMinsL]
Meter=String
MeterStyle=sBoxLab
X=209
Text=Mins

[MSecs]
Meter=String
MeterStyle=sNum
X=287
Text=--

[MSecsL]
Meter=String
MeterStyle=sBoxLab
X=287
Text=Secs

; ================= day progress
[MDayLab]
Meter=String
MeterStyle=sLabel
X=18
Y=124
Text=// Day progress

[MDayPct]
Meter=String
MeterStyle=sLabel
StringAlign=Right
FontColor=#cFg#
X=322
Y=124
Text=--

[MDayBar]
Meter=Bar
MeasureName=mScript
X=20
Y=140
W=300
H=6
BarColor=#cFg#
BarOrientation=Horizontal
ToolTipText=How much of today has passed

; ================= footer
[MDateLab]
Meter=String
MeterStyle=sLabel
X=18
Y=167
Text=Today

[MDateValue]
Meter=String
MeterStyle=sValue
X=18
Y=179
Text=--

[MUtcLab]
Meter=String
MeterStyle=sLabel
StringAlign=Right
X=322
Y=167
Text=UTC

[MUtcValue]
Meter=String
MeterStyle=sValue
StringAlign=Right
X=322
Y=179
Text=--
