; Net // Works IP card - live public and local IPv4 / IPv6, click to copy.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
ContextTitle=Look up now
ContextAction=[!CommandMeasure mRun "Run"]
ContextTitle2=Open network connections
ContextAction2=["ncpa.cpl"]

[Metadata]
Name=Net // Works IP
Author=ringmast4r
Information=Live public and local IPv4 / IPv6 addresses. Click any address to copy it, or COPY ALL. Public addresses come from ipify.org.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sVal]
FontFace=#fMono#
FontSize=9
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1
W=290
H=16
MouseActionCursorName=Hand

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -ExecutionPolicy Bypass -File "#@#Scripts\IP.ps1"
State=Hide
OutputType=UTF8
Timeout=20000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\IP.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,437,243 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,404,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,50,404,18 | Fill Color #cFg# | StrokeWidth 0
Shape4=Rectangle 18,132,404,18 | Fill Color #cFg# | StrokeWidth 0
Shape5=Rectangle 18,214,404,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=IP Address

[MHint]
Meter=String
MeterStyle=sCap
X=136
Y=18
Text=// click an address to copy

[MToggle]
Meter=String
MeterStyle=sBtn
X=416
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MPublicHead]
Meter=String
MeterStyle=sHead
X=24
Y=53
Text=Public

[MPublicSrc]
Meter=String
MeterStyle=sHead
StringAlign=Right
X=416
Y=53
Text=via ipify.org

[MLocalHead]
Meter=String
MeterStyle=sHead
X=24
Y=135
Text=Local

[PubV4Bg]
Meter=Image
X=18
Y=72
W=404
H=26
SolidColor=#cBg#
LeftMouseUpAction=[!CommandMeasure mScript "Copy('PubV4')"]
MouseActionCursorName=Hand

