; Net // Works Process Monitor - "Sin City" house style. Shares Procs.lua and the
; collector with the modern board, so the two can run side by side live.
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=["#@#Scripts\Launch.vbs"]
ContextTitle=Open Task Manager
ContextAction=["taskmgr.exe"]

[Metadata]
Name=Net // Works Processes
Author=ringmast4r
Information=Top 20 processes by CPU, memory, GPU and GPU memory side by side, in the Sin City monochrome house style with a dark/light toggle.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New
Mono=1
BarW=220
TileW=198
; Value colours step ink -> yellow -> red at these thresholds (Warn / Crit).
; CPU and GPU in % per process, Ram and Gmem in MB per process, Tile in % of the totals.
CpuWarn=25
CpuCrit=60
GpuWarn=25
GpuCrit=60
RamWarn=1024
RamCrit=4096
GmemWarn=512
GmemCrit=1536
TileWarn=60
TileCrit=85

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sTileVal]
FontFace=#fMono#
FontSize=15
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1

[sTileSub]
FontFace=#fMono#
FontSize=7
FontColor=#cMid#
AntiAlias=1
ClipString=1
H=12

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sRank]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cMid#
AntiAlias=1

[sName]
FontFace=#fMono#
FontSize=8
FontColor=#cFg#
AntiAlias=1
ClipString=1
W=134
H=14

[sVal]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
AntiAlias=1

; ================= measures
[mScript]
Measure=Script
ScriptFile=#@#Scripts\Procs.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,925,541 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
; header underline 3px, footer rule 2px
Shape2=Rectangle 12,38,904,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 12,512,904,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=12
Y=15
Text=Process Monitor

[MSub]
Meter=String
MeterStyle=sCap
X=200
Y=18
Text=// Top 20 per resource - grouped by process name

[MToggle]
Meter=String
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
X=910
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
MouseActionCursorName=Hand
ToolTipText=Switch to #ToggleTo# mode

