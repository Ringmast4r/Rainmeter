; Net // Works Speed card. Generated by @Resources\Tools\generate_net_cards.py
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0

[Metadata]
Name=Net // Works Speed
Author=ringmast4r
Information=Live download and upload speed on the best-route adapter, with a ~7 minute graph, peaks and data used.
Version=1.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sCap]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sHead]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cBg#
AntiAlias=1

[sCell]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
ClipString=1

[sBtn]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
MouseActionCursorName=Hand

; ================= measures
[mDown]
Measure=NetIn
Interface=Best

[mUp]
Measure=NetOut
Interface=Best

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Speed.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,437,233 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#
Shape2=Rectangle 18,38,404,3 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 18,204,404,2 | Fill Color #cFg# | StrokeWidth 0

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=Speed

[MHint]
Meter=String
MeterStyle=sCap
X=97
Y=18
Text=// live traffic

[MToggle]
Meter=String
MeterStyle=sBtn
X=416
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
ToolTipText=Switch to #ToggleTo# mode

[MFoot]
Meter=String
MeterStyle=sCap
StringCase=None
X=18
Y=214
Text=starting...

[DownBox]
Meter=Shape
Shape=Rectangle 19,51,196,64 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#

[DownCap]
Meter=String
MeterStyle=sCap
X=28
Y=57
Text=Download

[DownVal]
Meter=String
FontFace=#fMono#
FontSize=15
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1
X=28
Y=70
Text=--

[DownSub]
Meter=String
MeterStyle=sCap
StringCase=None
X=28
Y=99
W=180
H=12
ClipString=1
Text=

[UpBox]
Meter=Shape
Shape=Rectangle 225,51,196,64 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#

[UpCap]
Meter=String
MeterStyle=sCap
X=234
Y=57
Text=Upload

[UpVal]
Meter=String
FontFace=#fMono#
FontSize=15
StringStyle=Bold
FontColor=#cMid#
AntiAlias=1
X=234
Y=70
Text=--

[UpSub]
Meter=String
MeterStyle=sCap
StringCase=None
X=234
Y=99
W=180
H=12
ClipString=1
Text=

[MGraphBox]
Meter=Shape
Shape=Rectangle 18.5,124.5,403,70 | Fill Color #cAlt# | StrokeWidth 1 | Stroke Color #cFg#

[MGraph]
Meter=Line
MeasureName=mDown
MeasureName2=mUp
LineCount=2
LineColor=#cFg#
LineColor2=#cMid#
LineWidth=1.5
AutoScale=1
AntiAlias=1
X=20
Y=126
W=400
H=67

[MLegend]
Meter=String
MeterStyle=sCap
X=422
Y=214
StringAlign=Right
Text=~7 min  /  ink down  /  grey up
