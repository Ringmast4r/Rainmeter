; ---------------- styles
[sTitle]
FontFace=#fMain#
FontSize=9
StringStyle=Bold
StringCase=Upper
FontColor=#cText#
AntiAlias=1

[sCap]
FontFace=#fMain#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cText3#
AntiAlias=1

[sTileVal]
FontFace=#fLight#
FontSize=17
FontColor=#cText#
AntiAlias=1

[sTileSub]
FontFace=#fMain#
FontSize=7
FontColor=#cText2#
AntiAlias=1
ClipString=1
H=12

[sName]
FontFace=#fMain#
FontSize=8
StringStyle=Bold
FontColor=#cText#
AntiAlias=1
ClipString=1
H=15

[sAddr]
FontFace=#fMono#
FontSize=7
FontColor=#cText3#
AntiAlias=1
ClipString=1
H=12

[sStat]
FontFace=#fMain#
FontSize=7
FontColor=#cText2#
AntiAlias=1
ClipString=1
H=12

[sMs]
FontFace=#fMono#
FontSize=7
StringAlign=Right
FontColor=#cText3#
AntiAlias=1

; ---------------- measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=py.exe
Parameter=-3.13 -I "#@#Scripts\Fleet.py"
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Fleet.lua

; ---------------- chrome
[MCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,775,723,16 | Fill LinearGradient gCard | StrokeWidth 1 | Stroke Color #cLine#
gCard=90 | #cBgTop# ; 0.0 | #cBg# ; 1.0

[MTopBar]
Meter=Shape
Shape=Rectangle 18,0,740,3,1.5 | Fill LinearGradient gTop | StrokeWidth 0
gTop=0 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MDot]
Meter=Shape
Shape=Rectangle 18,17,7,7,2 | Fill LinearGradient gDot | StrokeWidth 0
gDot=45 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MTitle]
