[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=[!CommandMeasure mRun "Run"]
MouseScrollUpAction=[!CommandMeasure mScript "Scroll(-1)"]
MouseScrollDownAction=[!CommandMeasure mScript "Scroll(1)"]
ContextTitle=Check now
ContextAction=[!CommandMeasure mRun "Run"]
ContextTitle2=Open the settings file
ContextAction2=["#@#Local\settings.txt"]

[Metadata]
Name=NWModern Scanner Darkly
Author=ringmast4r
Information=Every URL in the Scanner Darkly registry, one per row, checked once a minute: a status dot, the name and the response time. Scroll for the rest, hover a row for its address and details, click it to open. Click the title for the Scanner Darkly index. Generated by @Resources\Tools\generate.py.
Version=0.1.1
License=Creative Commons BY-NC-SA 4.0

[Variables]
@Include=#@#Palette.inc
Rows=14
; Demo=1 swaps names for placeholders (screenshots)
Demo=0
Dot1=108,116,134
Dot2=108,116,134
Dot3=108,116,134
Dot4=108,116,134
Dot5=108,116,134
Dot6=108,116,134
Dot7=108,116,134
Dot8=108,116,134
Dot9=108,116,134
Dot10=108,116,134
Dot11=108,116,134
Dot12=108,116,134
Dot13=108,116,134
Dot14=108,116,134

; ---------------- styles
[sTitle]
FontFace=#fMain#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cText#
AntiAlias=1

[sCap]
FontFace=#fMain#
FontSize=9
StringStyle=Bold
FontColor=#cText3#
AntiAlias=1

[sName]
FontFace=#fMain#
FontSize=11
FontColor=#cText#
AntiAlias=1
ClipString=1
H=20

[sMs]
FontFace=#fMono#
FontSize=10
StringAlign=Right
FontColor=#cText3#
AntiAlias=1

; ---------------- measures
[mRun]
Measure=Plugin
Plugin=RunCommand
Program=py.exe
Parameter=-3.13 -I "#@#Scripts\Fleet.py"
State=Hide
OutputType=UTF8
Timeout=30000
FinishAction=[!CommandMeasure mScript "Parse()"]

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Fleet.lua

; ---------------- chrome
[MCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,379,567,16 | Fill LinearGradient gCard | StrokeWidth 1 | Stroke Color #cLine#
gCard=90 | #cBgTop# ; 0.0 | #cBg# ; 1.0

[MTopBar]
Meter=Shape
Shape=Rectangle 16,0,348,3,1.5 | Fill LinearGradient gTop | StrokeWidth 0
gTop=0 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MDot]
Meter=Shape
Shape=Rectangle 16,20,8,8,2 | Fill LinearGradient gDot | StrokeWidth 0
gDot=45 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MTitle]
Meter=String
MeterStyle=sTitle
X=31
Y=14
Text=Scanner // Darkly
MouseActionCursorName=Hand

[MSub]
Meter=String
MeterStyle=sCap
X=364
Y=17
StringAlign=Right
Text=checking...

[MFoot]
Meter=String
MeterStyle=sCap
StringStyle=Normal
X=16
Y=540
Text=

