[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Draggable=1
SnapEdges=1
OnRefreshAction=[!Log "Disc Sizes v1.2 loaded: recording types on every row and desktop Markdown reference." Notice]
ContextTitle=Open DVD project
ContextAction=["D:\11 Projects Library\DVD"]
ContextTitle2=Small (85%)
ContextAction2=[!WriteKeyValue Variables Scale 0.85][!Refresh]
ContextTitle3=Normal (100%)
ContextAction3=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle4=Large (120%)
ContextAction4=[!WriteKeyValue Variables Scale 1.2][!Refresh]
ContextTitle5=Open desktop disc reference
ContextAction5=["notepad.exe" "C:\Users\Squir\Desktop\Disc Sizes and Formats.md"]

[Metadata]
Name=Disc Sizes
Author=Patrick Quirk
Information=Disc format names, capacities and recording types. Drag to move. Right-click for size options.
Version=1.2

[Variables]
Scale=1
Text=235,239,245
Muted=155,166,184
CD=101,222,184
DVD=246,194,106
BD=117,178,255

[Body]
FontFace=Segoe UI
FontSize=(11*#Scale#)
FontColor=#Text#
AntiAlias=1

[Note]
FontFace=Segoe UI
FontSize=(9*#Scale#)
FontColor=#Muted#
AntiAlias=1

[Value]
FontFace=Consolas
FontSize=(12*#Scale#)
FontColor=#Text#
StringStyle=Bold
StringAlign=Right
AntiAlias=1

[Panel]
Meter=Shape
Shape=Rectangle 0,0,(440*#Scale#),(806*#Scale#),(14*#Scale#) | Fill Color 17,22,31,247 | StrokeWidth 1 | Stroke Color 62,73,92,255
