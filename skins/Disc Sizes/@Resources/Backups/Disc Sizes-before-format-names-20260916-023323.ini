[Rainmeter]
Update=-1
AccurateText=1
DynamicWindowSize=1
Draggable=1
SnapEdges=1
OnRefreshAction=[!Log "Disc Sizes reference loaded: CD, DVD, Blu-ray and BDXL." Notice]
ContextTitle=Open DVD project
ContextAction=["D:\11 Projects Library\DVD"]
ContextTitle2=Small (85%)
ContextAction2=[!WriteKeyValue Variables Scale 0.85][!Refresh]
ContextTitle3=Normal (100%)
ContextAction3=[!WriteKeyValue Variables Scale 1][!Refresh]
ContextTitle4=Large (120%)
ContextAction4=[!WriteKeyValue Variables Scale 1.2][!Refresh]

[Metadata]
Name=Disc Sizes
Author=Patrick Quirk
Information=CD, DVD, Blu-ray and BDXL capacity reference. Drag to move. Right-click for size options.
Version=1.0

[Variables]
Scale=1
Text=235,239,245
Muted=155,166,184
CD=101,222,184
DVD=246,194,106
BD=117,178,255

[Body]
FontFace=Segoe UI
FontSize=(11*#Scale#)
FontColor=#Text#
AntiAlias=1

[Note]
FontFace=Segoe UI
FontSize=(9*#Scale#)
FontColor=#Muted#
AntiAlias=1

[Value]
FontFace=Consolas
FontSize=(12*#Scale#)
FontColor=#Text#
StringStyle=Bold
StringAlign=Right
AntiAlias=1

[Panel]
Meter=Shape
Shape=Rectangle 0,0,(440*#Scale#),(806*#Scale#), (14*#Scale#) | Fill Color 17,22,31,247 | StrokeWidth 1 | Stroke Color 62,73,92,255
Shape2=Line (24*#Scale#),(79*#Scale#),(416*#Scale#),(79*#Scale#) | StrokeWidth 1 | Stroke Color 57,68,86

