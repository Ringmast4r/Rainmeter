[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
OnRefreshAction=["#@#Scripts\Launch.vbs"]
ContextTitle=Open Task Manager
ContextAction=["taskmgr.exe"]

[Metadata]
Name=NWModern Processes
Author=ringmast4r
Information=Top 20 processes by CPU, memory, GPU and GPU memory side by side, measured the way Task Manager does.
Version=2.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
@Include=#@#Palette.inc

; ---------------- styles
[sTitle]
FontFace=#fMain#
FontSize=9
StringStyle=Bold
StringCase=Upper
FontColor=#cText#
AntiAlias=1

[sCap]
FontFace=#fMain#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cText3#
AntiAlias=1

[sTileVal]
FontFace=#fLight#
FontSize=17
FontColor=#cText#
AntiAlias=1

[sTileSub]
FontFace=#fMain#
FontSize=7
FontColor=#cText2#
AntiAlias=1
ClipString=1
H=12

[sRank]
FontFace=#fMono#
FontSize=7
StringAlign=Right
FontColor=#cText3#
AntiAlias=1

[sName]
FontFace=#fMain#
FontSize=8
FontColor=#cText#
AntiAlias=1
ClipString=1
W=142
H=14

[sVal]
FontFace=#fMono#
FontSize=8
StringAlign=Right
FontColor=#cText2#
AntiAlias=1

; ---------------- measures
[mScript]
Measure=Script
ScriptFile=#@#Scripts\Procs.lua

; ---------------- chrome
[MCard]
Meter=Shape
Shape=Rectangle 0.5,0.5,969,519,16 | Fill LinearGradient gCard | StrokeWidth 1 | Stroke Color #cLine#
gCard=90 | #cBgTop# ; 0.0 | #cBg# ; 1.0

[MTopBar]
Meter=Shape
Shape=Rectangle 18,0,934,3,1.5 | Fill LinearGradient gTop | StrokeWidth 0
gTop=0 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MDot]
Meter=Shape
Shape=Rectangle 18,17,7,7,2 | Fill LinearGradient gDot | StrokeWidth 0
gDot=45 | #cAccent# ; 0.0 | #cAccent2# ; 1.0

[MTitle]
Meter=String
MeterStyle=sTitle
X=32
Y=13
Text=Process Monitor

[MSub]
Meter=String
MeterStyle=sCap
X=952
Y=15
StringAlign=Right
Text=Top 20 per resource  -  grouped by process name

[MRule]
Meter=Shape
Shape=Rectangle 18,100,934,1 | Fill Color #cLine# | StrokeWidth 0
Shape2=Rectangle 18,490,934,1 | Fill Color #cLine# | StrokeWidth 0

; ================= CPU column
[TCpuBg]
Meter=Shape
Shape=Rectangle 18,32,226,58,10 | Fill Color #cTile# | StrokeWidth 0
Shape2=Rectangle 28,80,206,3,1.5 | Fill Color 255,255,255,14 | StrokeWidth 0
Shape3=Rectangle 18,120,226,1 | Fill Color 255,255,255,10 | StrokeWidth 0

