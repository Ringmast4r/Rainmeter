[Rainmeter]
Update=1000
BackgroundMode=0
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=CyberOps Large Time Display
Author=Patrick Quirk
Information=Massive time display optimized for 3-inch LCD screen
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
timeSize=120
dateSize=36
colorTime=0,255,0,255
colorDate=0,200,0,255
colorBackground=0,0,0,255

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureTime]
Measure=Time
Format=%I:%M %p

[MeasureDate]
Measure=Time
Format=%a, %b %d

; ----------------------------------
; METERS
; ----------------------------------

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=400
Y=5
FontFace=#fontName#
FontSize=#timeSize#
FontColor=#colorTime#
StringAlign=Center
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
Text=%1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=400
Y=165
FontFace=#fontName#
FontSize=#dateSize#
FontColor=#colorDate#
StringAlign=Center
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
Text=%1

