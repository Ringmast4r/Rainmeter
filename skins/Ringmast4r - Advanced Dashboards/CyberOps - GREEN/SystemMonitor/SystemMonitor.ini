[Rainmeter]
Update=1000
BackgroundMode=2
SolidColor=0,0,0,200
AccurateText=1

[Metadata]
Name=CyberOps System Monitor
Author=Patrick Quirk
Information=Cybersecurity-themed system monitor displaying CPU, RAM, Network, and system info
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
fontSize=9
colorPrimary=0,255,0,255
colorSecondary=0,200,0,255
colorBackground=0,0,0,200
colorText=0,255,0,200
colorBar=0,255,0,150
barWidth=200
barHeight=3

; ----------------------------------
; MEASURES - Data Collection
; ----------------------------------

[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
UpdateDivider=10

[MeasureNetworkIn]
Measure=NetIn
Interface=Best
DynamicVariables=1

[MeasureNetworkOut]
Measure=NetOut
Interface=Best
DynamicVariables=1

[MeasureIP]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[MeasureComputerName]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME

[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!i!h %2!i!m

[MeasureTime]
Measure=Time
Format=%H:%M:%S

[MeasureDate]
Measure=Time
Format=%Y-%m-%d

; ----------------------------------
; STYLES
; ----------------------------------

[StyleTitle]
FontFace=#fontName#
FontSize=11
FontColor=#colorPrimary#
StringStyle=Bold
StringAlign=Left
AntiAlias=1
StringEffect=Shadow
FontEffectColor=0,0,0,100

[StyleLabel]
FontFace=#fontName#
FontSize=#fontSize#
FontColor=#colorSecondary#
StringAlign=Left
AntiAlias=1
StringEffect=Shadow
FontEffectColor=0,0,0,100

[StyleValue]
FontFace=#fontName#
FontSize=#fontSize#
FontColor=#colorText#
StringAlign=Right
AntiAlias=1
StringEffect=Shadow
FontEffectColor=0,0,0,100

[StyleBar]
BarColor=#colorBar#
SolidColor=0,0,0,100
BarOrientation=Horizontal
W=#barWidth#
H=#barHeight#

; ----------------------------------
; METERS - Display
; ----------------------------------

[MeterTitle]
Meter=String
MeterStyle=StyleTitle
X=10
Y=10
Text=[ CYBER OPS - SYSTEM MONITOR ]

[MeterSeperator1]
Meter=Image
X=10
Y=30
W=280
H=1
SolidColor=0,255,0,100

; === SYSTEM INFO ===

[MeterHostnameLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=40
Text=HOSTNAME:

[MeterHostnameValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureComputerName
X=290
Y=0r
Text=%1

[MeterIPLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=55
Text=IP ADDRESS:

[MeterIPValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureIP
X=290
Y=0r
Text=%1

[MeterUptimeLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=70
Text=UPTIME:

[MeterUptimeValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureUptime
X=290
Y=0r
Text=%1

[MeterTimeLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=85
Text=TIMESTAMP:

[MeterTimeValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDate
X=290
Y=0r
Text=[MeasureDate] [MeasureTime]

[MeterSeperator2]
Meter=Image
X=10
Y=105
W=280
H=1
SolidColor=0,255,0,100

; === CPU ===

[MeterCPULabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=115
Text=CPU USAGE:

[MeterCPUValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureCPU
X=290
Y=0r
Text=%1%
NumOfDecimals=1

[MeterCPUBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureCPU
X=10
Y=130

; === RAM ===

[MeterRAMLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=145
Text=RAM USAGE:

[MeterRAMValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureRAM
X=290
Y=0r
Text=%1%
Percentual=1
NumOfDecimals=1

[MeterRAMBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureRAM
X=10
Y=160

; === DISK ===

[MeterDiskLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=175
Text=DISK (C:) FREE:

[MeterDiskValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureDisk
X=290
Y=0r
Text=%1B
AutoScale=1
NumOfDecimals=1

[MeterDiskBar]
Meter=Bar
MeterStyle=StyleBar
MeasureName=MeasureDisk
X=10
Y=190
InvertMeasure=1

[MeterSeperator3]
Meter=Image
X=10
Y=200
W=280
H=1
SolidColor=0,255,0,100

; === NETWORK ===

[MeterNetInLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=210
Text=NET DOWNLOAD:

[MeterNetInValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNetworkIn
X=290
Y=0r
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[MeterNetOutLabel]
Meter=String
MeterStyle=StyleLabel
X=10
Y=225
Text=NET UPLOAD:

[MeterNetOutValue]
Meter=String
MeterStyle=StyleValue
MeasureName=MeasureNetworkOut
X=290
Y=0r
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[MeterSeperator4]
Meter=Image
X=10
Y=245
W=280
H=1
SolidColor=0,255,0,100

[MeterFooter]
Meter=String
MeterStyle=StyleLabel
X=10
Y=255
Text=[ DEFENSIVE SECURITY MONITORING ]
FontSize=8

