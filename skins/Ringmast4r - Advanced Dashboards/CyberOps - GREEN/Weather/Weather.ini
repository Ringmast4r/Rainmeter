[Rainmeter]
Update=1000
BackgroundMode=0
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=CyberOps Weather Display
Author=Patrick Quirk
Information=Large weather display with CyberOps theme. Includes astronomical data.
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
tempSize=100
conditionSize=32
detailSize=24
labelSize=20
colorPrimary=0,255,0,255
colorSecondary=0,200,0,255
colorText=0,180,0,255
; Change this to your ZIP code or City
Location=33432
; Get your free API key from: https://www.weatherapi.com/signup.aspx
APIKey=YOUR_API_KEY_HERE

; ----------------------------------
; MEASURES - Weather Data
; ----------------------------------

[MeasureWeather]
Measure=Plugin
Plugin=WebParser
URL=http://api.weatherapi.com/v1/astronomy.json?key=#APIKey#&q=#Location#&aqi=no
RegExp=(?siU).*"sunrise":"(.*)","sunset":"(.*)","moonrise":"(.*)","moonset":"(.*)","moon_phase":"(.*)","moon_illumination"
UpdateRate=1800
DynamicVariables=1

[MeasureCurrentWeather]
Measure=Plugin
Plugin=WebParser
URL=http://api.weatherapi.com/v1/current.json?key=#APIKey#&q=#Location#&aqi=no
RegExp=(?siU).*"temp_f":(.*),"temp_c.*"condition":\{"text":"(.*)","icon.*"feelslike_f":(.*),"feelslike_c.*"humidity":(.*),"cloud.*"wind_mph":(.*),"wind_kph"
UpdateRate=1800
DynamicVariables=1

[MeasureTemp]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCurrentWeather]
StringIndex=1

[MeasureCondition]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCurrentWeather]
StringIndex=2

[MeasureFeelsLike]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCurrentWeather]
StringIndex=3

[MeasureHumidity]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCurrentWeather]
StringIndex=4

[MeasureWind]
Measure=Plugin
Plugin=WebParser
URL=[MeasureCurrentWeather]
StringIndex=5

[MeasureSunrise]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureSunset]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureMoonrise]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=3

[MeasureMoonset]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=4

[MeasureMoonPhase]
Measure=Plugin
Plugin=WebParser
URL=[MeasureWeather]
StringIndex=5

; ----------------------------------
; METERS - Display
; ----------------------------------

[MeterTitle]
Meter=String
X=10
Y=10
FontFace=#fontName#
FontSize=#labelSize#
FontColor=#colorSecondary#
StringAlign=Left
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
Text=WEATHER - ZIP: [#Location]

[MeterTemp]
Meter=String
MeasureName=MeasureTemp
X=10
Y=40
FontFace=#fontName#
FontSize=#tempSize#
FontColor=#colorPrimary#
StringAlign=Left
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
Text=%1Â°F

