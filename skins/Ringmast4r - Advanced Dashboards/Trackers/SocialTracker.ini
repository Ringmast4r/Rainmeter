[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=20,20,20,220

[Variables]
FontFace=Segoe UI
FontColor=255,255,255,255
FontSize=12
LabelSize=10
AccentGitHub=138,96,208
AccentYouTube=255,0,0
AccentTwitter=29,161,242
AccentInstagram=225,48,108
AccentReddit=255,69,0
ScriptPath=#CURRENTPATH#get_followers.py

; ============== TITLE ==============
[MeterTitle]
Meter=String
X=110
Y=10
W=220
FontFace=#FontFace#
FontSize=13
FontWeight=Bold
FontColor=#FontColor#
StringAlign=Center
AntiAlias=1
Text=SOCIAL TRACKER

; ============== GITHUB ==============
[MeasureGitHub]
Measure=Plugin
Plugin=RunCommand
Program=python
Parameter="#ScriptPath#" github Ringmast4r
State=Hide
OutputType=ANSI
UpdateDivider=60
FinishAction=[!UpdateMeter MeterGitHubCount][!Redraw]

[MeterGitHubLabel]
Meter=String
X=15
Y=45
FontFace=#FontFace#
FontSize=#LabelSize#
FontColor=#AccentGitHub#
AntiAlias=1
Text=GitHub

[MeterGitHubCount]
Meter=String
MeasureName=MeasureGitHub
X=205
Y=45
FontFace=#FontFace#
FontSize=#FontSize#
FontWeight=Bold
FontColor=#AccentGitHub#
StringAlign=Right
AntiAlias=1
Text=%1

; ============== YOUTUBE ==============
[MeterYouTubeLabel]
Meter=String
X=15
Y=75
FontFace=#FontFace#
FontSize=#LabelSize#
FontColor=#AccentYouTube#
AntiAlias=1
Text=YouTube

[MeterYouTubeCount]
Meter=String
X=205
Y=75
FontFace=#FontFace#
FontSize=#FontSize#
FontWeight=Bold
FontColor=#AccentYouTube#
StringAlign=Right
AntiAlias=1
Text=Need API Key

