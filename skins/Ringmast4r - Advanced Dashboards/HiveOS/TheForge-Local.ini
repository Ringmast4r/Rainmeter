; ==================================
; MEASURES
; ==================================

; --- Ping test to check if rig is online ---
[measurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#rigIP#
Timeout=2000
UpdateRate=1

[measurePingMS]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#rigIP#
Timeout=2000
UpdateRate=1

[measureOnlineStatus]
Measure=Calc
Formula=(measurePing >= 0) ? 1 : 0
DynamicVariables=1
IfCondition=measureOnlineStatus = 1
IfTrueAction=[!SetOption meterStatusIndicator SolidColor "#colorOnline#"][!SetOption meterStatusText Text "MINING"][!SetOption meterStatusText FontColor "0,0,0,255"][!SetOption meterPingValue Text "#rigIP# (Online)"][!SetOption meterPingMS Text "[measurePingMS]ms"][!ShowMeter meterHashLabel][!ShowMeter meterHashValue][!ShowMeter meterPowerLabel][!ShowMeter meterPowerValue][!UpdateMeter *][!Redraw]
IfCondition2=measureOnlineStatus = 0
IfTrueAction2=[!SetOption meterStatusIndicator SolidColor "#colorOffline#"][!SetOption meterStatusText Text "OFFLINE"][!SetOption meterStatusText FontColor "#colorOffline#"][!SetOption meterPingValue Text "#rigIP# (Offline)"][!SetOption meterPingMS Text "---"][!HideMeter meterHashLabel][!HideMeter meterHashValue][!HideMeter meterPowerLabel][!HideMeter meterPowerValue][!UpdateMeter *][!Redraw]

[measureUptime]
Measure=Uptime
Format=%dd %hh %mm

[measureUpdateTime]
Measure=Time
Format=%I:%M:%S %p

; --- XRP Balance from UnMineable ---
[measureXRPBalance]
Measure=Plugin
Plugin=WebParser
URL=https://api.unmineable.com/v4/address/#xrpAddress#?coin=XRP
RegExp=(?siU).*"balance":"([0-9.]+)".*
StringIndex=1
UpdateRate=120
Substitute="":"0.00"

