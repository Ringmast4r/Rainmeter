; MAC Address & OUI Viewer
; ----------------------------------

[Rainmeter]
Update=1000
SolidColor=0,0,0,180
AccurateText=1
OnRefreshAction=[!CommandMeasure measureMACs "Run"]

[Metadata]
Name=MAC Address Viewer
Author=Anonymous
Information=Displays all network adapter MAC addresses
Version=1.0.0

[Variables]
fontName=Segoe UI
colorText=255,255,255,230
colorLabel=100,200,255,255
colorDim=150,150,150,200

; ==================================
; MEASURES
; ==================================

[measureMACs]
Measure=Plugin
Plugin=RunCommand
Parameter=powershell -NoProfile -Command "$adapters = Get-NetAdapter | Sort-Object Name; $output = ''; foreach ($a in $adapters) { if ($a.MacAddress) { $mac = $a.MacAddress -replace '-', ':'; $status = if ($a.Status -eq 'Up') { ' [ONLINE]' } else { '' }; $output += \"$($a.Name)$status`n  $mac`n`n\" } }; Write-Output $output"
OutputType=UTF8
State=Hide
FinishAction=[!UpdateMeter meterMACList][!Redraw]

[measureTime]
Measure=Time
Format=%I:%M:%S %p

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
X=0
Y=0
W=320
H=240
SolidColor=0,0,0,180

[meterTitle]
Meter=String
X=160
Y=15
W=320
H=20
StringAlign=Center
StringCase=Upper
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=13
AntiAlias=1
Text=MAC ADDRESSES

[meterSubtitle]
Meter=String
X=160
Y=38
W=320
H=14
StringAlign=Center
FontColor=#colorDim#
FontFace=#fontName#
FontSize=8
AntiAlias=1
Text=Network Adapters

[meterLine1]
Meter=Image
X=20
Y=56
W=280
H=1
SolidColor=255,255,255,30

[meterMACList]
Meter=String
MeasureName=measureMACs
X=25
Y=66
W=270
H=130
StringAlign=Left
FontColor=#colorText#
FontFace=Consolas
FontSize=9
AntiAlias=1
ClipString=2
Text=%1

[meterRefresh]
Meter=String
X=160
Y=200
W=320
H=16
StringAlign=Center
FontFace=#fontName#
FontSize=8
FontColor=#colorLabel#
Text=[CLICK TO REFRESH]
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure measureMACs "Run"]
ToolTipText=Refresh MAC list

[meterLine2]
Meter=Image
X=20
Y=218
W=280
H=1
SolidColor=255,255,255,30

[meterFooter]
Meter=String
MeasureName=measureTime
X=160
Y=224
W=320
H=14
StringAlign=Center
FontColor=#colorDim#
FontFace=#fontName#
FontSize=7
AntiAlias=1
Text=Updated: %1

