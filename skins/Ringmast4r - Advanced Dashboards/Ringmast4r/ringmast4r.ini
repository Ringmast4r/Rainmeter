; ringmast4r - Ultimate Unified Dashboard
; All illustro widgets combined into one epic skin
; ----------------------------------

[Rainmeter]
Update=1000
SolidColor=0,0,0,180
DynamicWindowSize=1
AccurateText=1

[Metadata]
Name=ringmast4r
Author=Anonymous
Information=Ultimate unified dashboard - all widgets in one!
License=Creative Commons BY-NC-SA 3.0
Version=1.0.0

[Variables]
fontName=Segoe UI
textSize=12
colorBar=220,50,50,255
colorText=255,255,255,230
colorLabel=220,50,50,255
colorDim=255,255,255,150
disk1=C:
disk2=D:
disk3=E:
disk4=F:
; Set to your internet speed in bytes per second
; 100 Mbps = 12500000, 500 Mbps = 62500000, 1 Gbps = 125000000
maxBandwidth=125000000

; ==================================
; MEASURES
; ==================================

; --- Time & Date ---
[measureTime]
Measure=Time
Format=%I:%M:%S %p

[measureDate]
Measure=Time
Format=%A, %B %d, %Y

; --- System Stats ---
[measureCPU]
Measure=CPU
Processor=0

[measureRAM]
Measure=PhysicalMemory

[measureRAMUsed]
Measure=PhysicalMemory

[measureRAMTotal]
Measure=PhysicalMemory
Total=1

[measureRAMUsedGB]
Measure=Calc
Formula=measureRAMUsed / 1073741824

[measureRAMTotalGB]
Measure=Calc
Formula=measureRAMTotal / 1073741824

[measureSWAP]
Measure=SwapMemory

[measureUptime]
Measure=Uptime
Format=%4!i!d %3!i!h %2!i!m %1!i!s

; --- Disk Stats ---
[measureFreeDisk1]
Measure=FreeDiskSpace
Drive=#disk1#
UpdateDivider=60

[measureTotalDisk1]
Measure=FreeDiskSpace
Drive=#disk1#
Total=1
UpdateDivider=60

[measureUsedDisk1]
Measure=FreeDiskSpace
Drive=#disk1#
InvertMeasure=1
UpdateDivider=60

[measureDiskPercent1]
Measure=Calc
Formula=(measureUsedDisk1 / measureTotalDisk1) * 100
MinValue=0
MaxValue=100
IfCondition=measureDiskPercent1 < 50
IfTrueAction=[!SetOption meterBarDisk1 BarColor "50,200,50,255"]
IfCondition2=(measureDiskPercent1 >= 50) && (measureDiskPercent1 < 75)
IfTrueAction2=[!SetOption meterBarDisk1 BarColor "220,200,50,255"]
IfCondition3=measureDiskPercent1 >= 75
IfTrueAction3=[!SetOption meterBarDisk1 BarColor "220,50,50,255"]

[measureFreeDisk2]
Measure=FreeDiskSpace
Drive=#disk2#
UpdateDivider=60

[measureTotalDisk2]
Measure=FreeDiskSpace
Drive=#disk2#
Total=1
UpdateDivider=60

[measureUsedDisk2]
Measure=FreeDiskSpace
Drive=#disk2#
InvertMeasure=1
UpdateDivider=60

[measureDiskPercent2]
Measure=Calc
Formula=(measureUsedDisk2 / measureTotalDisk2) * 100
MinValue=0
MaxValue=100
IfCondition=measureDiskPercent2 < 50
IfTrueAction=[!SetOption meterBarDisk2 BarColor "50,200,50,255"]
IfCondition2=(measureDiskPercent2 >= 50) && (measureDiskPercent2 < 75)
IfTrueAction2=[!SetOption meterBarDisk2 BarColor "220,200,50,255"]
IfCondition3=measureDiskPercent2 >= 75
IfTrueAction3=[!SetOption meterBarDisk2 BarColor "220,50,50,255"]

[measureFreeDisk3]
Measure=FreeDiskSpace
Drive=#disk3#
UpdateDivider=60

[measureTotalDisk3]
Measure=FreeDiskSpace
Drive=#disk3#
Total=1
UpdateDivider=60

[measureUsedDisk3]
Measure=FreeDiskSpace
Drive=#disk3#
InvertMeasure=1
UpdateDivider=60

[measureDiskPercent3]
Measure=Calc
Formula=(measureUsedDisk3 / measureTotalDisk3) * 100
MinValue=0
MaxValue=100
IfCondition=measureDiskPercent3 < 50
IfTrueAction=[!SetOption meterBarDisk3 BarColor "50,200,50,255"]
IfCondition2=(measureDiskPercent3 >= 50) && (measureDiskPercent3 < 75)
IfTrueAction2=[!SetOption meterBarDisk3 BarColor "220,200,50,255"]
IfCondition3=measureDiskPercent3 >= 75
IfTrueAction3=[!SetOption meterBarDisk3 BarColor "220,50,50,255"]

[measureFreeDisk4]
Measure=FreeDiskSpace
Drive=#disk4#
UpdateDivider=60

[measureTotalDisk4]
Measure=FreeDiskSpace
Drive=#disk4#
Total=1
UpdateDivider=60

[measureUsedDisk4]
Measure=FreeDiskSpace
Drive=#disk4#
InvertMeasure=1
UpdateDivider=60

[measureDiskPercent4]
Measure=Calc
Formula=(measureUsedDisk4 / measureTotalDisk4) * 100
MinValue=0
MaxValue=100
IfCondition=measureDiskPercent4 < 50
IfTrueAction=[!SetOption meterBarDisk4 BarColor "50,200,50,255"]
IfCondition2=(measureDiskPercent4 >= 50) && (measureDiskPercent4 < 75)
IfTrueAction2=[!SetOption meterBarDisk4 BarColor "220,200,50,255"]
IfCondition3=measureDiskPercent4 >= 75
IfTrueAction3=[!SetOption meterBarDisk4 BarColor "220,50,50,255"]

; --- Network Stats ---
[measureNetIn]
Measure=NetIn
Interface=Best

[measureNetOut]
Measure=NetOut
Interface=Best

[measureNetTotal]
Measure=Calc
Formula=(measureNetIn + measureNetOut)

[measureNetPercent]
Measure=Calc
Formula=(measureNetTotal / #maxBandwidth#) * 100
MinValue=0
MaxValue=100

[measureIP]
Measure=WebParser
URL=https://checkip.amazonaws.com/
UpdateRate=14400
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"N/A"

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

; --- System Info ---
[measureUserName]
Measure=Plugin
Plugin=SysInfo
SysInfoType=USER_NAME

[measureComputerName]
Measure=Plugin
Plugin=SysInfo
SysInfoType=COMPUTER_NAME

[measureOS]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=ProductName

[measureOSBuild]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=CurrentBuild

[measureDisplayVersion]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SOFTWARE\Microsoft\Windows NT\CurrentVersion
RegValue=DisplayVersion

[measureCPUName]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=HARDWARE\DESCRIPTION\System\CentralProcessor\0
RegValue=ProcessorNameString

[measureGPU]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\Class\{4d36e968-e325-11ce-bfc1-08002be10318}\0000
RegValue=DriverDesc

[measureResolution]
Measure=Plugin
Plugin=SysInfo
SysInfoType=SCREEN_SIZE

[measureHost]
Measure=Registry
RegHKey=HKEY_LOCAL_MACHINE
RegKey=SYSTEM\CurrentControlSet\Control\SystemInformation
RegValue=SystemProductName

; --- Weather ---
[measureWeather]
Measure=WebParser
URL=https://wttr.in/New%20York,NY?format=%l|%c|%t|%h|%w|%C
UpdateRate=900
RegExp=(.+)\|(.+)\|(.+)\|(.+)\|(.+)\|(.+)
Substitute="":"-"

[measureLocation]
Measure=WebParser
URL=[measureWeather]
StringIndex=1

[measureTemp]
Measure=WebParser
URL=[measureWeather]
StringIndex=3

[measureHumidity]
Measure=WebParser
URL=[measureWeather]
StringIndex=4

[measureWind]
Measure=WebParser
URL=[measureWeather]
StringIndex=5

[measureCondition]
Measure=WebParser
URL=[measureWeather]
StringIndex=6

; --- Recycle Bin ---
[measureBinItems]
Measure=RecycleManager
RecycleType=Count
UpdateDivider=3

[measureBinSize]
Measure=RecycleManager
RecycleType=Size
UpdateDivider=3

