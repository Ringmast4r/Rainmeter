; IP Address Skin - Creepster Font
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=10,0,20,200

[Metadata]
Name=IP Address - Creepster
Author=Anonymous
Information=Displays current IP addresses with Creepster font
Version=1.0.0

[Variables]
fontName=Creepster
textSize=14
colorText=200,100,255,255
colorLabel=150,50,200,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=50,0,80,100
FontColor=180,50,255,255
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=80,0,120,30
X=0
Y=0
W=280
H=115
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=5
W=280
Text=IP ADDRESS

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=42
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=270
Y=0r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=75
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=270
Y=0r
W=180
Text=%1

