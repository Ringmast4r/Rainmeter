; IP Address Skin - Gloock Font
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=15,15,20,220

[Metadata]
Name=IP Address - Gloock
Author=Anonymous
Information=Displays current IP addresses with Gloock font
Version=1.0.0

[Variables]
fontName=Gloock
textSize=13
colorText=255,255,255,240
colorLabel=255,200,100,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,80
FontColor=255,220,150,255
FontFace=#fontName#
FontSize=16
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=255,200,100,10
X=0
Y=0
W=260
H=105
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=130
Y=8
W=260
Text=IP Address

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=40
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=250
Y=0r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=68
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=250
Y=0r
W=180
Text=%1

