; IP Address Skin
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,180

[Metadata]
Name=IP Address
Author=Anonymous
Information=Displays current IP addresses
Version=1.2.0

[Variables]
fontName=Segoe UI
textSize=11
colorText=255,255,255,230
colorLabel=220,50,50,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,50
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=12
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=255,255,255,5
X=0
Y=0
W=220
H=95
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=110
Y=8
W=220
Text=IP ADDRESS

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=35
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=210
Y=0r
W=150
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=60
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=210
Y=0r
W=150
Text=%1

