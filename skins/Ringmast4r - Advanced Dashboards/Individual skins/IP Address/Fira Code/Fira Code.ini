; IP Address Skin - Fira Code Font
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=10,15,20,230

[Metadata]
Name=IP Address - Fira Code
Author=Anonymous
Information=Displays current IP addresses with Fira Code font
Version=1.0.0

[Variables]
fontName=Fira Code
textSize=11
colorText=0,255,150,255
colorLabel=0,200,255,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,50,30,100
FontColor=0,255,200,255
FontFace=#fontName#
FontSize=14
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Regular
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=0,255,150,8
X=0
Y=0
W=270
H=100
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=135
Y=8
W=270
Text=> IP_ADDRESS

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=38
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=260
Y=0r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=62
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=260
Y=0r
W=180
Text=%1

[meterCursor]
Meter=String
MeterStyle=styleValue
X=260
Y=82
FontColor=0,255,150,200
Text=_

