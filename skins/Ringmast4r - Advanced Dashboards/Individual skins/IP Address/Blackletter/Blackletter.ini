; IP Address Skin - Blackletter/Old English Font
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=20,15,10,220

[Metadata]
Name=IP Address - Blackletter
Author=Anonymous
Information=Displays current IP addresses with Old English font
Version=1.0.0

[Variables]
fontName=Old English Text MT
textSize=12
colorText=255,230,180,255
colorLabel=200,160,100,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=None
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,100
FontColor=220,180,100,255
FontFace=#fontName#
FontSize=18
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=Segoe UI
FontSize=11
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=200,160,100,15
X=0
Y=0
W=280
H=110
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=5
W=280
Text=IP Address

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=40
W=60
Text=Local:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=270
Y=2r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=70
W=60
Text=Public:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=270
Y=2r
W=180
Text=%1

