; ================================================================
;  TOTALS
; ================================================================
[MeasureTotalSize]
Measure=Calc
Formula=MeasureAlbanianAISize+MeasureColombiaSize+MeasureDomRepSize+MeasureIranSize+MeasureIraqSize+MeasureMexicoSize+MeasurePakistanSize+MeasureCubaSize+MeasureVenezuelaV2Size

[MeasureTotalFiles]
Measure=Calc
Formula=MeasureAlbanianAIFiles+MeasureColombiaFiles+MeasureDomRepFiles+MeasureIranFiles+MeasureIraqFiles+MeasureMexicoFiles+MeasurePakistanFiles+MeasureCubaFiles+MeasureVenezuelaV2Files

[MeasureTotalFolders]
Measure=Calc
Formula=MeasureAlbanianAIFolders+MeasureColombiaFolders+MeasureDomRepFolders+MeasureIranFolders+MeasureIraqFolders+MeasureMexicoFolders+MeasurePakistanFolders+MeasureCubaFolders+MeasureVenezuelaV2Folders

[MeterTotalLabel]
