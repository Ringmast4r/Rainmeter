X=(#PanelW#/2)
Y=636
StringAlign=Center
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#AccentColor#
Text=[ REFRESH ]
MouseOverAction=[!SetOption MeterRefreshBtn FontColor "255,255,255,255"][!UpdateMeter MeterRefreshBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterRefreshBtn FontColor "#AccentColor#"][!UpdateMeter MeterRefreshBtn][!Redraw]
LeftMouseUpAction=[!Refresh]

