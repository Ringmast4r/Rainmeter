[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1
DpiScaling=0

[Metadata]
Name=OSINT Projects Folder Monitor
Author=Claude
Version=4.0
Description=Auto-sorted by size â€” largest folder on top

[Variables]
FontFace=Segoe UI
FontColor=255,255,255,220
LabelColor=160,160,160,200
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=0,200,150,255
PanelW=260

; ================================================================
;  LUA SORT SCRIPT
; ================================================================
[MeasureSort]
Measure=Script
ScriptFile=#CURRENTPATH#Sort.lua

; ================================================================
;  BACKGROUND
; ================================================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,380,10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

; ================================================================
;  HEADER
; ================================================================
[MeterHeader]
Meter=String
X=(#PanelW#/2)
Y=12
StringAlign=Center
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=OSINT PROJECTS

[MeterSubHeader]
Meter=String
X=(#PanelW#/2)
Y=30
StringAlign=Center
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=live monitor // sorted by size

[MeterDivider0]
Meter=Shape
Shape=Rectangle 15,48,230,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  RAW MEASURES (hidden, used by Lua)
; ================================================================
[MeasureRwandaSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Rwanda
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*

[MeasureRwandaFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Rwanda
InfoType=FileCount
IncludeSubFolders=1
