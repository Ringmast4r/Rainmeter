MeasureName=MeasureTotalSize
X=15
Y=315
W=230
H=10
BarColor=#AccentColor#
SolidColor=0,0,0,0
BarOrientation=Horizontal

[MeterBarLegend]
Meter=String
X=15
Y=330
FontFace=#FontFace#
FontSize=7
FontColor=#DimColor#
