; ================================================================
;  TOTALS
; ================================================================
[MeasureTotalSize]
Measure=Calc
Formula=MeasureRwandaSize+MeasureHaitiSize+MeasureEcuadorSize+MeasureBurkinaFasoSize

[MeasureTotalFiles]
Measure=Calc
Formula=MeasureRwandaFiles+MeasureHaitiFiles+MeasureEcuadorFiles+MeasureBurkinaFasoFiles

[MeasureTotalFolders]
Measure=Calc
Formula=MeasureRwandaFolders+MeasureHaitiFolders+MeasureEcuadorFolders+MeasureBurkinaFasoFolders

[MeterTotalLabel]
Meter=String
X=15
Y=268
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=#AccentColor#
