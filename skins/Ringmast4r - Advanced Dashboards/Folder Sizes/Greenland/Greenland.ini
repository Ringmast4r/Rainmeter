[Rainmeter]
Update=3000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Greenland Folder Size
Author=Claude
Version=1.0
Description=Displays the size of the Greenland folder

[Variables]
FontFace=Segoe UI
FontColor=255,255,255,220
BackgroundColor=20,20,20,180
AccentColor=100,200,120,255

; ========== Background ==========
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,180,60,8 | Fill Color #BackgroundColor# | StrokeWidth 0

; ========== Title ==========
[MeterTitle]
Meter=String
X=15
Y=10
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#AccentColor#
Text=Greenland

; ========== Folder Size ==========
[MeasureFolderSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\THE WORLD AT LARGE\Greenland
InfoType=FolderSize
RegExpFilter=.*
IncludeSubFolders=1

[MeterSize]
Meter=String
MeasureName=MeasureFolderSize
X=15
Y=32
FontFace=#FontFace#
FontSize=14
FontWeight=500
FontColor=#FontColor#
AutoScale=1
Text=%1B

