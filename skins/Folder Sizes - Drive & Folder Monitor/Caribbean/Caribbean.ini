[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1
DpiScaling=0

[Metadata]
Name=Caribbean Folder Monitor
Author=Claude
Version=1.0
Description=Auto-sorted by size â€” largest folder on top

[Variables]
FontFace=Segoe UI
FontColor=255,255,255,220
LabelColor=160,160,160,200
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=0,200,150,255
PanelW=260

; ================================================================
;  LUA SORT SCRIPT
; ================================================================
[MeasureSort]
Measure=Script
ScriptFile=#CURRENTPATH#Sort.lua

; ================================================================
;  BACKGROUND
; ================================================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,275,10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

; ================================================================
;  HEADER
; ================================================================
[MeterHeader]
Meter=String
X=(#PanelW#/2)
Y=12
StringAlign=Center
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=CARIBBEAN

[MeterSubHeader]
Meter=String
X=(#PanelW#/2)
Y=30
StringAlign=Center
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=live monitor // sorted by size

[MeterDivider0]
Meter=Shape
Shape=Rectangle 15,48,230,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  RAW MEASURES (hidden, used by Lua)
; ================================================================
[MeasureDomRepSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Dominican Republic
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureDomRepFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Dominican Republic
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureDomRepFolders]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Dominican Republic
InfoType=FolderCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureCubaSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\CUBA
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureCubaFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\CUBA
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureCubaFolders]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\CUBA
InfoType=FolderCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

; ================================================================
;  SLOT 1 (largest)
; ================================================================
[MeterSlot1Name]
Meter=String
X=15
Y=58
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#AccentColor#
Text=---
DynamicVariables=1

[MeterSlot1Size]
Meter=String
MeasureName=MeasureDomRepSize
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=11
FontWeight=700
FontColor=#FontColor#
AutoScale=1
Text=%1B
DynamicVariables=1

[MeterSlot1Files]
Meter=String
MeasureName=MeasureDomRepFiles
X=15
Y=78
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Files: %1
DynamicVariables=1

[MeterSlot1Folders]
Meter=String
MeasureName=MeasureDomRepFolders
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Folders: %1
DynamicVariables=1

[MeterDivider1]
Meter=Shape
Shape=Rectangle 15,100,230,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  SLOT 2
; ================================================================
[MeterSlot2Name]
Meter=String
X=15
Y=110
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#AccentColor#
Text=---
DynamicVariables=1

[MeterSlot2Size]
Meter=String
MeasureName=MeasureDomRepSize
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=11
FontWeight=700
FontColor=#FontColor#
AutoScale=1
Text=%1B
DynamicVariables=1

[MeterSlot2Files]
Meter=String
MeasureName=MeasureDomRepFiles
X=15
Y=130
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Files: %1
DynamicVariables=1

[MeterSlot2Folders]
Meter=String
MeasureName=MeasureDomRepFolders
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Folders: %1
DynamicVariables=1

[MeterDivider2]
Meter=Shape
Shape=Rectangle 15,152,230,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  TOTALS
; ================================================================
[MeasureTotalSize]
Measure=Calc
Formula=MeasureDomRepSize+MeasureCubaSize

[MeasureTotalFiles]
Measure=Calc
Formula=MeasureDomRepFiles+MeasureCubaFiles

[MeasureTotalFolders]
Measure=Calc
Formula=MeasureDomRepFolders+MeasureCubaFolders

[MeterTotalLabel]
Meter=String
X=15
Y=164
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=#AccentColor#
Text=COMBINED TOTAL

[MeterTotalSize]
Meter=String
MeasureName=MeasureTotalSize
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=#AccentColor#
AutoScale=1
Text=%1B

[MeterTotalFiles]
Meter=String
MeasureName=MeasureTotalFiles
X=15
Y=186
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Files: %1

[MeterTotalFolders]
Meter=String
MeasureName=MeasureTotalFolders
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Folders: %1

; ================================================================
;  BAR
; ================================================================
[MeterBarBg]
Meter=Shape
Shape=Rectangle 15,211,230,10,3 | Fill Color 40,40,40,200 | StrokeWidth 0

[MeterBarTop]
Meter=Bar
MeasureName=MeasureTotalSize
X=15
Y=211
W=230
H=10
BarColor=#AccentColor#
SolidColor=0,0,0,0
BarOrientation=Horizontal

[MeterBarLegend]
Meter=String
X=15
Y=226
FontFace=#FontFace#
FontSize=7
FontColor=#DimColor#
Text=Combined total

; ================================================================
;  SIZE REFERENCE
; ================================================================
[MeterDivider5]
Meter=Shape
Shape=Rectangle 15,244,230,1,0 | Fill Color #BorderColor# | StrokeWidth 0

[MeterGuide]
Meter=String
X=(#PanelW#/2)
Y=252
StringAlign=Center
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=B > kB > MB > GB > TB > PB > EB
MouseOverAction=[!SetOption MeterGuide FontColor "255,255,255,255"][!UpdateMeter MeterGuide][!Redraw]
MouseLeaveAction=[!SetOption MeterGuide FontColor "#DimColor#"][!UpdateMeter MeterGuide][!Redraw]
LeftMouseUpAction=[!Refresh]

