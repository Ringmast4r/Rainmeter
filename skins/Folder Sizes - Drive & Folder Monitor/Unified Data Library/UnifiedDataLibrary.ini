[MeterDbValue]
Meter=String
MeasureName=MeasureDbFiles
MeasureName2=MeasureJsFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
Text=%1 / %2

; ================================================================
;  CONDITIONAL MEDIA ROWS
; ================================================================
[MeterPhotoLabel]
Meter=String
X=15
Y=310
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Photos
Hidden=1

[MeterPhotoValue]
Meter=String
MeasureName=MeasurePhotoFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#AccentColor#
Text=%1
Hidden=1

[MeterVideoLabel]
Meter=String
X=15
Y=(310 + (MeasurePhotoFiles > 0 ? 20 : 0))
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Videos
Hidden=1
DynamicVariables=1

[MeterVideoValue]
Meter=String
MeasureName=MeasureVideoFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#AccentColor#
Text=%1
Hidden=1

; ================================================================
;  REFRESH
; ================================================================
[MeterDivider2]
Meter=Shape
Shape=Rectangle 15,(310 + [MeasureMediaOffset]),210,1,0 | Fill Color #BorderColor# | StrokeWidth 0
DynamicVariables=1

[MeterRefreshBtn]
Meter=String
X=(#PanelW#/2)
Y=(314 + [MeasureMediaOffset])
StringAlign=Center
FontFace=#FontFace#
FontSize=9
FontWeight=600
FontColor=#RefreshColor#
Text=[  REFRESH  ]
DynamicVariables=1
MouseOverAction=[!SetOption MeterRefreshBtn FontColor #RefreshHover#][!UpdateMeter MeterRefreshBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterRefreshBtn FontColor #RefreshColor#][!UpdateMeter MeterRefreshBtn][!Redraw]
LeftMouseUpAction=[!UpdateMeasure MeasureFolderSize][!UpdateMeasure MeasureTotalFiles][!UpdateMeasure MeasureFolders][!UpdateMeasure MeasureHtmlFiles][!UpdateMeasure MeasureCsvFiles][!UpdateMeasure MeasureMdFiles][!UpdateMeasure MeasureJsonFiles][!UpdateMeasure MeasureTsvFiles][!UpdateMeasure MeasurePyFiles][!UpdateMeasure MeasurePdfFiles][!UpdateMeasure MeasureDbFiles][!UpdateMeasure MeasureJsFiles][!UpdateMeasure MeasurePhotoFiles][!UpdateMeasure MeasureVideoFiles][!UpdateMeter *][!Redraw]

