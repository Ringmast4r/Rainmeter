FontSize=9
FontColor=#FontColor#
Text=%1

[MeterPdfLabel]
Meter=String
X=15
Y=270
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=.pdf

[MeterPdfValue]
Meter=String
MeasureName=MeasurePdfFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
