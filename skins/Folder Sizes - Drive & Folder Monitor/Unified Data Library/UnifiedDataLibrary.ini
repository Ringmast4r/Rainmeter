[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1

[Metadata]
Name=Unified Data Library Monitor
Author=Claude
Version=3.0
Description=Displays UDL folder size, file type breakdown, and conditional media counts

[Variables]
FontFace=Segoe UI
FontColor=200,200,200,200
LabelColor=160,160,160,200
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=200,70,70,240
RefreshColor=200,70,70,200
RefreshHover=230,100,100,255
PanelW=240

; ================================================================
;  MEASURES
; ================================================================
[MeasureFolderSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*

[MeasureTotalFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*

[MeasureFolders]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FolderCount
IncludeSubFolders=1
RegExpFilter=.*

[MeasureHtmlFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.html$

[MeasureCsvFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.csv$

[MeasureMdFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.md$

[MeasureJsonFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.json$

[MeasureTsvFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.tsv$

[MeasurePyFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.py$

[MeasurePdfFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.pdf$

[MeasureDbFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.db$

[MeasureJsFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.js$

[MeasurePhotoFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.(png|jpg|jpeg|gif|bmp|svg|webp|ico|tiff)$
IfCondition=MeasurePhotoFiles > 0
IfTrueAction=[!ShowMeter MeterPhotoLabel][!ShowMeter MeterPhotoValue][!UpdateMeter *][!Redraw]
IfFalseAction=[!HideMeter MeterPhotoLabel][!HideMeter MeterPhotoValue][!UpdateMeter *][!Redraw]

[MeasureVideoFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Unified Data Library
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.(mp4|mkv|avi|mov|webm|wmv|flv|m4v)$
IfCondition=MeasureVideoFiles > 0
IfTrueAction=[!ShowMeter MeterVideoLabel][!ShowMeter MeterVideoValue][!UpdateMeter *][!Redraw]
IfFalseAction=[!HideMeter MeterVideoLabel][!HideMeter MeterVideoValue][!UpdateMeter *][!Redraw]

; ================================================================
;  DYNAMIC HEIGHT CALC
; ================================================================
[MeasureMediaOffset]
Measure=Calc
Formula=(MeasurePhotoFiles > 0 ? 20 : 0) + (MeasureVideoFiles > 0 ? 20 : 0)
DynamicVariables=1

[MeasurePanelH]
Measure=Calc
Formula=330 + (MeasurePhotoFiles > 0 ? 20 : 0) + (MeasureVideoFiles > 0 ? 20 : 0)
DynamicVariables=1

; ================================================================
;  BACKGROUND
; ================================================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,[MeasurePanelH],10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1
DynamicVariables=1

; ================================================================
;  HEADER
; ================================================================
[MeterHeader]
Meter=String
X=15
Y=12
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=UNIFIED DATA LIBRARY

[MeterSubHeader]
Meter=String
X=15
Y=32
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=Desktop\Unified Data Library
LeftMouseUpAction=["explorer.exe" "C:\Users\Squir\Desktop\Unified Data Library"]
MouseOverAction=[!SetOption MeterSubHeader FontColor #AccentColor#][!UpdateMeter MeterSubHeader][!Redraw]
MouseLeaveAction=[!SetOption MeterSubHeader FontColor #DimColor#][!UpdateMeter MeterSubHeader][!Redraw]

[MeterDivider0]
Meter=Shape
Shape=Rectangle 15,50,210,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  FOLDER SIZE + TOTALS
; ================================================================
[MeterSizeLabel]
Meter=String
X=15
Y=60
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Size

[MeterSizeValue]
Meter=String
MeasureName=MeasureFolderSize
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#FontColor#
AutoScale=1
Text=%1B

[MeterTotalLabel]
Meter=String
X=15
Y=80
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Files

[MeterTotalValue]
Meter=String
MeasureName=MeasureTotalFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#FontColor#
Text=%1

[MeterFoldersLabel]
Meter=String
X=15
Y=100
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Folders

[MeterFoldersValue]
Meter=String
MeasureName=MeasureFolders
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#FontColor#
Text=%1

; ================================================================
;  FILE TYPE BREAKDOWN
; ================================================================
[MeterDivider1]
Meter=Shape
Shape=Rectangle 15,122,210,1,0 | Fill Color #BorderColor# | StrokeWidth 0

[MeterBreakdownHeader]
Meter=String
X=15
Y=130
FontFace=#FontFace#
FontSize=9
FontWeight=600
FontColor=#AccentColor#
Text=FILE TYPES

[MeterHtmlLabel]
Meter=String
X=15
Y=150
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=.html

[MeterHtmlValue]
Meter=String
MeasureName=MeasureHtmlFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#AccentColor#
Text=%1

[MeterCsvLabel]
Meter=String
X=15
Y=170
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
