Text=%1

[MeterMdLabel]
Meter=String
X=15
Y=190
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=.md

[MeterMdValue]
Meter=String
MeasureName=MeasureMdFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
Text=%1

[MeterJsonLabel]
Meter=String
X=15
Y=210
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=.json

[MeterJsonValue]
Meter=String
MeasureName=MeasureJsonFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
Text=%1

[MeterTsvLabel]
Meter=String
X=15
Y=230
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=.tsv

[MeterTsvValue]
Meter=String
MeasureName=MeasureTsvFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
