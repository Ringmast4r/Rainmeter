[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1
DpiScaling=0
Draggable=1

[Metadata]
Name=E Drive Folder Monitor
Author=Claude
Version=6.0
Description=E: drive folder sizes — 3 column, Lua sorted on refresh

[Variables]
FontFace=Segoe UI
FontColor=240,240,240,255
LabelColor=180,180,180,240
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=66,133,244,255
PanelW=940

[MeasureSort]
Measure=Script
ScriptFile=#CURRENTPATH#Sort.lua

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,920,10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

[MeterHeader]
Meter=String
X=(#PanelW#/2)
Y=12
StringAlign=Center
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=E: Drive

[MeterSubHeader]
Meter=String
X=(#PanelW#/2)
Y=30
StringAlign=Center
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=sorted by size // click refresh to update

[MeterDivider0]
Meter=Shape
Shape=Rectangle 15,48,910,1,0 | Fill Color #BorderColor# | StrokeWidth 0

[MeasureUsedSpace]
Measure=FreeDiskSpace
Drive=E:
InvertMeasure=1

[MeasureTotalSpace]
Measure=FreeDiskSpace
Drive=E:
Total=1

[MeasureFreeSpace]
Measure=FreeDiskSpace
Drive=E:

[MeterDriveUsed]
Meter=String
MeasureName=MeasureUsedSpace
MeasureName2=MeasureTotalSpace
X=15
Y=55
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
AutoScale=1
Text=Used: %1B / %2B

[MeterDriveFree]
Meter=String
MeasureName=MeasureFreeSpace
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
AutoScale=1
Text=Free: %1B

[MeterDriveBarBg]
Meter=Shape
Shape=Rectangle 15,75,910,8,3 | Fill Color 40,40,40,200 | StrokeWidth 0

[MeterDriveBar]
Meter=Bar
MeasureName=MeasureUsedSpace
X=15
Y=75
W=910
H=8
BarColor=#AccentColor#
SolidColor=0,0,0,0
BarOrientation=Horizontal

[MeterDividerDrive]
Meter=Shape
Shape=Rectangle 15,92,910,1,0 | Fill Color #BorderColor# | StrokeWidth 0

