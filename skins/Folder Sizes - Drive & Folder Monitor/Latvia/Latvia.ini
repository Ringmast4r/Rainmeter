[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1

[Metadata]
Name=Latvia Folder Size
Author=Claude
Version=4.0
Description=Total size, files, and folders for LATVIA

[Variables]
FontFace=Segoe UI
FontColor=240,240,240,255
LabelColor=180,180,180,240
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=155,30,45,255

; ========== Background ==========
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,220,105,8 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

; ========== Title ==========
[MeterTitle]
Meter=String
X=15
Y=10
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=LATVIA
LeftMouseUpAction=["C:\Users\Squir\Desktop\LATVIA"]

; ========== Measures (30s refresh) ==========
[MeasureSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\LATVIA
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\LATVIA
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

[MeasureFolders]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\LATVIA
InfoType=FolderCount
IncludeSubFolders=1
RegExpFilter=.*
UpdateDivider=10

; ========== Size ==========
[MeterSize]
Meter=String
MeasureName=MeasureSize
X=15
Y=35
FontFace=#FontFace#
FontSize=16
FontWeight=700
FontColor=#FontColor#
AutoScale=1
Text=%1B
DynamicVariables=1

; ========== Files | Folders ==========
[MeterDetail]
Meter=String
MeasureName=MeasureFiles
MeasureName2=MeasureFolders
X=15
Y=62
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Files: %1  |  Folders: %2
DynamicVariables=1

; ========== Refresh ==========
[MeterRefresh]
Meter=String
X=15
Y=84
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=Refresh
MouseOverAction=[!SetOption MeterRefresh FontColor "255,255,255,220"][!UpdateMeter MeterRefresh][!Redraw]
MouseLeaveAction=[!SetOption MeterRefresh FontColor "#DimColor#"][!UpdateMeter MeterRefresh][!Redraw]
LeftMouseUpAction=[!Refresh]

