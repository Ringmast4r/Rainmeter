[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1
WindowX=15
WindowY=(-80)R
OnRefreshAction=[!Move "15" "(#SCREENAREAHEIGHT#-80)"]

[Metadata]
Name=System Uptime
Author=Claude
Version=1.0
Description=Displays machine uptime pinned to bottom left

[Variables]
FontFace=Segoe UI
FontColor=200,200,200,200
LabelColor=160,160,160,200
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=255,50,50,255
PanelW=200

; ================================================================
;  MEASURES
; ================================================================
[MeasureUptime]
Measure=Uptime
Format=%4!i!d %3!i!h %2!i!m %1!i!s

[MeasureUptimeDays]
Measure=Uptime
Format=%4!i!

[MeasureUptimeHours]
Measure=Uptime
Format=%3!i!

[MeasureUptimeMinutes]
Measure=Uptime
Format=%2!i!

[MeasureUptimeSeconds]
Measure=Uptime
Format=%1!i!

; ================================================================
;  BACKGROUND
; ================================================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,70,10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

; ================================================================
;  HEADER
; ================================================================
[MeterHeader]
Meter=String
X=15
Y=10
FontFace=#FontFace#
FontSize=11
FontWeight=700
FontColor=#AccentColor#
Text=UPTIME

[MeterMachine]
Meter=String
X=(#PanelW#-15)
Y=12
StringAlign=Right
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=%COMPUTERNAME%
DynamicVariables=1

; ================================================================
;  UPTIME DISPLAY
; ================================================================
[MeterUptimeValue]
Meter=String
MeasureName=MeasureUptimeDays
MeasureName2=MeasureUptimeHours
MeasureName3=MeasureUptimeMinutes
MeasureName4=MeasureUptimeSeconds
X=(#PanelW#/2)
Y=38
StringAlign=Center
FontFace=#FontFace#
FontSize=13
FontWeight=700
FontColor=#FontColor#
Text=%1d  %2h  %3m  %4s
DynamicVariables=1

