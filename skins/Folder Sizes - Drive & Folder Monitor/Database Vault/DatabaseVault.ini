[Rainmeter]
Update=60000
AccurateText=1
DynamicWindowSize=1
AntiAlias=1

[Metadata]
Name=Database Vault Monitor
Author=Claude
Version=1.0
Description=Displays Database Vault folder size and .db file count with manual refresh

[Variables]
FontFace=Segoe UI
FontColor=200,200,200,200
LabelColor=160,160,160,200
DimColor=120,120,120,180
BackgroundColor=15,15,15,200
BorderColor=50,50,50,200
AccentColor=0,120,112,220
RefreshColor=0,150,140,180
RefreshHover=0,200,190,255
PanelW=240

; ================================================================
;  BACKGROUND
; ================================================================
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,170,10 | Fill Color #BackgroundColor# | Stroke Color #BorderColor# | StrokeWidth 1

; ================================================================
;  HEADER
; ================================================================
[MeterHeader]
Meter=String
X=15
Y=12
FontFace=#FontFace#
FontSize=12
FontWeight=700
FontColor=#AccentColor#
Text=DATABASE VAULT

[MeterSubHeader]
Meter=String
X=15
Y=32
FontFace=#FontFace#
FontSize=8
FontColor=#DimColor#
Text=C:\Users\Squir\Desktop\Database Vault
LeftMouseUpAction=["explorer.exe" "C:\Users\Squir\Desktop\Database Vault"]
MouseOverAction=[!SetOption MeterSubHeader FontColor #AccentColor#][!UpdateMeter MeterSubHeader][!Redraw]
MouseLeaveAction=[!SetOption MeterSubHeader FontColor #DimColor#][!UpdateMeter MeterSubHeader][!Redraw]

[MeterDivider0]
Meter=Shape
Shape=Rectangle 15,50,210,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  MEASURES
; ================================================================
[MeasureFolderSize]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Database Vault
InfoType=FolderSize
IncludeSubFolders=1
RegExpFilter=.*

[MeasureDbFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Database Vault
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*\.db$

[MeasureTotalFiles]
Measure=Plugin
Plugin=FolderInfo
Folder=C:\Users\Squir\Desktop\Database Vault
InfoType=FileCount
IncludeSubFolders=1
RegExpFilter=.*

; ================================================================
;  FOLDER SIZE
; ================================================================
[MeterSizeLabel]
Meter=String
X=15
Y=60
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Size

[MeterSizeValue]
Meter=String
MeasureName=MeasureFolderSize
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#FontColor#
AutoScale=1
Text=%1B

; ================================================================
;  DB FILE COUNT
; ================================================================
[MeterDbLabel]
Meter=String
X=15
Y=82
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=DB Files

[MeterDbValue]
Meter=String
MeasureName=MeasureDbFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#AccentColor#
Text=%1

; ================================================================
;  TOTAL FILE COUNT
; ================================================================
[MeterTotalLabel]
Meter=String
X=15
Y=104
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Total Files

[MeterTotalValue]
Meter=String
MeasureName=MeasureTotalFiles
X=(#PanelW#-15)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=9
FontWeight=700
FontColor=#FontColor#
Text=%1

; ================================================================
;  DIVIDER
; ================================================================
[MeterDivider1]
Meter=Shape
Shape=Rectangle 15,126,210,1,0 | Fill Color #BorderColor# | StrokeWidth 0

; ================================================================
;  REFRESH BUTTON
; ================================================================
[MeterRefreshBtn]
Meter=String
X=(#PanelW#/2)
Y=136
StringAlign=Center
FontFace=#FontFace#
FontSize=9
FontWeight=600
FontColor=#RefreshColor#
Text=[  REFRESH  ]
MouseOverAction=[!SetOption MeterRefreshBtn FontColor #RefreshHover#][!UpdateMeter MeterRefreshBtn][!Redraw]
MouseLeaveAction=[!SetOption MeterRefreshBtn FontColor #RefreshColor#][!UpdateMeter MeterRefreshBtn][!Redraw]
LeftMouseUpAction=[!UpdateMeasure MeasureFolderSize][!UpdateMeasure MeasureDbFiles][!UpdateMeasure MeasureTotalFiles][!UpdateMeter *][!Redraw]

