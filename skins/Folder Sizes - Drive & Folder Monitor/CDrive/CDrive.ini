[Rainmeter]
Update=3000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=C Drive Space
Author=Claude
Version=1.0
Description=Displays C: drive usage

[Variables]
FontFace=Segoe UI
FontColor=255,255,255,220
LabelColor=180,180,180,200
BackgroundColor=20,20,20,180
AccentColor=255,180,100,255
BarColor=255,180,100,255
BarBgColor=60,60,60,200

; ========== Background ==========
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,180,95,8 | Fill Color #BackgroundColor# | StrokeWidth 0

; ========== Title ==========
[MeterTitle]
Meter=String
X=15
Y=10
FontFace=#FontFace#
FontSize=11
FontWeight=600
FontColor=#AccentColor#
Text=C: Drive

; ========== Measures ==========
[MeasureFreeSpace]
Measure=FreeDiskSpace
Drive=C:

[MeasureTotalSpace]
Measure=FreeDiskSpace
Drive=C:
Total=1

[MeasureUsedSpace]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

; ========== Used Display ==========
[MeterUsedLabel]
Meter=String
X=15
Y=35
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Used:

[MeterUsed]
Meter=String
MeasureName=MeasureUsedSpace
MeasureName2=MeasureTotalSpace
X=165
Y=0r
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
StringAlign=Right
AutoScale=1
Text=%1B / %2B

; ========== Progress Bar ==========
[MeterBarBg]
Meter=Shape
Shape=Rectangle 15,58,150,12,3 | Fill Color #BarBgColor# | StrokeWidth 0

[MeterBar]
Meter=Bar
MeasureName=MeasureUsedSpace
X=15
Y=58
W=150
H=12
BarColor=#BarColor#
SolidColor=0,0,0,0
BarOrientation=Horizontal

; ========== Free Space ==========
[MeterFreeLabel]
Meter=String
X=15
Y=75
FontFace=#FontFace#
FontSize=9
FontColor=#LabelColor#
Text=Free:

[MeterFree]
Meter=String
MeasureName=MeasureFreeSpace
X=165
Y=0r
FontFace=#FontFace#
FontSize=9
FontColor=#FontColor#
StringAlign=Right
AutoScale=1
Text=%1B

