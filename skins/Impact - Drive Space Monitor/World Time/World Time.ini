; World Time Skin - Impact Font
; Bold block style - Vertical layout
; ----------------------------------

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=World Time - Impact
Author=Anonymous
Information=Displays world time for Atlanta, Madrid, Berlin
Version=1.0.0

[Variables]
fontName=Impact
colorText=170,170,170,180
colorLabel=255,50,50,255
colorDivider=255,255,255,80

; ==================================
; MEASURES
; ==================================

[measureTimeAtlanta]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%I:%M %p

[measureDateAtlanta]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%A, %b %d

[measureTimeMadrid]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%I:%M %p

[measureDateMadrid]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%A, %b %d

[measureTimeBerlin]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%I:%M %p

[measureDateBerlin]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%A, %b %d

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Normal
StringEffect=Border
FontEffectColor=0,0,0,150
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=22
AntiAlias=1

[styleCity]
StringAlign=Center
StringCase=Upper
StringStyle=Normal
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=16
AntiAlias=1

[styleTime]
StringAlign=Center
StringStyle=Normal
FontColor=#colorText#
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleDate]
StringAlign=Center
FontColor=170,170,170,130
FontFace=#fontName#
FontSize=11
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=20,20,20,220
X=0
Y=0
W=220
H=305
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterAccentTop]
Meter=Image
SolidColor=170,170,170,160
X=0
Y=0
W=220
H=3

[meterAccentBottom]
Meter=Image
SolidColor=255,50,50,255
X=0
Y=302
W=220
H=3

; --- TITLE ---

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=110
Y=10
W=220
Text=World Time

; --- DIVIDER 1 ---

[meterDiv1]
Meter=Image
SolidColor=#colorDivider#
X=20
Y=45
W=180
H=1

; --- MADRID ---

[meterCityMadrid]
Meter=String
MeterStyle=styleCity
X=110
Y=55
W=220
Text=Madrid

[meterTimeMadrid]
Meter=String
MeterStyle=styleTime
MeasureName=measureTimeMadrid
X=110
Y=78
W=220
Text=%1

[meterDateMadrid]
Meter=String
MeterStyle=styleDate
MeasureName=measureDateMadrid
X=110
Y=108
W=220
