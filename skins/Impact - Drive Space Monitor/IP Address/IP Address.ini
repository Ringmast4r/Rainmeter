; IP Address Skin - Impact Font
; Bold block style with live network graph
; ----------------------------------

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=IP Address - Impact
Author=Anonymous
Information=Displays IP addresses and live network activity with Impact font
Version=1.0.0

[Variables]
fontName=Impact
textSize=16
colorText=255,255,255,255
colorLabel=255,50,50,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

[measureNetIn]
Measure=NetIn
Interface=0

[measureNetOut]
Measure=NetOut
Interface=0

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Normal
StringEffect=Border
FontEffectColor=0,0,0,150
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Normal
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Normal
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=20,20,20,220
X=0
Y=0
W=280
H=190
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterAccent1]
Meter=Image
SolidColor=255,255,255,255
X=0
Y=0
W=280
H=3

[meterAccent2]
Meter=Image
SolidColor=255,50,50,255
X=0
Y=187
W=280
H=3

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=NETWORK

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=45
W=80
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=270
Y=3r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=78
W=80
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=270
Y=3r
W=180
Text=%1

[meterLabelDown]
Meter=String
MeterStyle=styleLabel
X=10
Y=111
W=80
FontSize=11
Text=DOWN:

[meterValueDown]
Meter=String
MeterStyle=styleValue
MeasureName=measureNetIn
X=135
Y=1r
W=100
FontSize=11
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[meterLabelUp]
Meter=String
MeterStyle=styleLabel
X=150
Y=111
W=80
FontSize=11
Text=UP:

[meterValueUp]
Meter=String
MeterStyle=styleValue
MeasureName=measureNetOut
X=270
Y=1r
W=100
FontSize=11
Text=%1B/s
AutoScale=1
NumOfDecimals=1

[meterGraphBg]
Meter=Image
SolidColor=0,0,0,100
X=10
Y=140
W=260
H=40

[meterGraphIn]
Meter=Line
MeasureName=measureNetIn
X=10
Y=140
W=260
H=40
LineColor=255,255,255,200
LineWidth=1.5
AutoScale=1
AntiAlias=1

[meterGraphOut]
Meter=Line
MeasureName=measureNetOut
X=10
Y=140
W=260
H=40
LineColor=255,50,50,200
LineWidth=1.5
AutoScale=1
AntiAlias=1

