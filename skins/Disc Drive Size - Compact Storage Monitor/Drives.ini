[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
MiddleMouseUpAction=[!Refresh]

[Metadata]
Name=Disc Drive Size
Author=Anonymous
Version=3.0
Information=Drive list fed by @DriveData background task - zero blocking I/O in Rainmeter

[Variables]
Width=290
BarW=258
BarH=2
ColorBack=20,22,28,235
ColorTitle=235,235,240,255
ColorHeader=120,160,255,255
ColorText=210,212,220,255
ColorSub=140,144,156,255
ColorTrack=45,48,58,255
FontName=Segoe UI
@IncludeDriveData=#SKINSPATH#@DriveData\DriveData.inc

[sLabel]
FontFace=#FontName#
FontSize=11
FontColor=#ColorText#
AntiAlias=1
StringStyle=Bold

[sValue]
FontFace=#FontName#
FontSize=9
FontColor=#ColorSub#
AntiAlias=1
StringAlign=Right

[sBar]
W=#BarW#
H=#BarH#
SolidColor=#ColorTrack#
BarOrientation=Horizontal

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,(#Width#),620,8 | Fill Color #ColorBack# | StrokeWidth 1 | Stroke Color 70,74,86,255

[MeterTitle]
Meter=String
X=16
Y=14
FontFace=#FontName#
FontSize=14
FontColor=#ColorTitle#
StringStyle=Bold
AntiAlias=1
Text=DRIVE SPACE

[MeterTitleSub]
Meter=String
X=16
Y=37
FontFace=#FontName#
FontSize=9
FontColor=#ColorSub#
AntiAlias=1
Text=Local & network drives  (updated #Generated#)

[MeterHeaderLocal]
Meter=String
X=16
Y=58
FontFace=#FontName#
FontSize=9
FontColor=#ColorHeader#
StringStyle=Bold
AntiAlias=1
Text=LOCAL DRIVES

; --- C ---
[mC_Pct]
Measure=Calc
Formula=#C_Pct#
MinValue=0
MaxValue=100

[MeterC_Label]
Meter=String
MeterStyle=sLabel
X=16
Y=78
Text=#C_Name#
Hidden=#C_Hidden#

[MeterC_Value]
Meter=String
MeterStyle=sValue
X=274
Y=0r
Text=#C_Size#
Hidden=#C_Hidden#

[MeterC_Bar]
Meter=Bar
MeterStyle=sBar
X=16
Y=98
MeasureName=mC_Pct
BarColor=#C_Bar#
LeftMouseUpAction=["C:\"]
ToolTipText=Open C:\
Hidden=#C_Hidden#

