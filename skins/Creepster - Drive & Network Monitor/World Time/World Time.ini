; World Time Skin - Creepster Font
; Spooky/Halloween style - Vertical layout
; ----------------------------------

[Rainmeter]
Update=1000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=World Time - Creepster
Author=Anonymous
Information=Displays world time for Atlanta, Los Angeles, Germany, and Paris
Version=1.0.0

[Variables]
fontName=Creepster
colorText=255,255,255,255
colorLabel=50,205,50,255
colorDivider=255,255,255,80

; ==================================
; MEASURES
; ==================================

[measureTimeAtlanta]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%I:%M:%S %p

[measureDateAtlanta]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%A, %b %d

[measureTimeLosAngeles]
Measure=Time
TimeZone=-8
DaylightSavingTime=1
Format=%I:%M:%S %p

[measureDateLosAngeles]
Measure=Time
TimeZone=-8
DaylightSavingTime=1
Format=%A, %b %d

[measureTimeGermany]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%I:%M:%S %p

[measureDateGermany]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%A, %b %d

[measureTimeParis]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%I:%M:%S %p

[measureDateParis]
Measure=Time
TimeZone=1
DaylightSavingTime=1
Format=%A, %b %d

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
FontColor=255,255,255,255
FontFace=#fontName#
FontSize=22
AntiAlias=1

[styleCity]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=16
AntiAlias=1

[styleTime]
StringAlign=Center
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleDate]
StringAlign=Center
FontColor=255,255,255,150
FontFace=#fontName#
FontSize=11
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=15,10,15,220
X=0
Y=0
W=220
H=460
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterAccentTop]
Meter=Image
SolidColor=255,255,255,255
X=0
Y=0
W=220
H=3

[meterAccentBottom]
Meter=Image
SolidColor=50,205,50,255
X=0
Y=457
W=220
H=3

; --- TITLE ---

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=110
Y=10
W=220
Text=World Time

; --- DIVIDER 1 ---

[meterDiv1]
Meter=Image
SolidColor=#colorDivider#
X=20
Y=45
W=180
H=1

