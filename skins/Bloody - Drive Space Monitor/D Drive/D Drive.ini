; D Drive Storage Skin - Bloody Font
; Horror/Blood drip style
; ----------------------------------

[Rainmeter]
Update=5000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=D Drive Storage - Bloody
Author=Anonymous
Information=Displays D Drive storage info with Bloody font
Version=1.0.0

[Variables]
fontName=Bloody
textSize=14
colorText=255,50,50,255
colorLabel=180,0,0,255
colorBar=180,0,0,255

; ==================================
; MEASURES
; ==================================

[measureTotal]
Measure=FreeDiskSpace
Drive=D:
Total=1
UpdateDivider=10

[measureUsed]
Measure=FreeDiskSpace
Drive=D:
InvertMeasure=1
UpdateDivider=10

[measureFree]
Measure=FreeDiskSpace
Drive=D:
UpdateDivider=10

[measurePercent]
Measure=Calc
Formula=(measureUsed / measureTotal) * 100
MinValue=0
MaxValue=100

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=50,0,0,100
FontColor=200,0,0,255
FontFace=#fontName#
FontSize=18
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=Consolas
FontSize=12
AntiAlias=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,30

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=20,0,0,50
X=0
Y=0
W=280
H=180
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=D: DRIVE

[meterLabelUsed]
Meter=String
MeterStyle=styleLabel
X=10
Y=45
W=80
Text=Used:

[meterValueUsed]
Meter=String
MeterStyle=styleValue
MeasureName=measureUsed
X=270
Y=0r
W=180
Text=%1B
AutoScale=1
NumOfDecimals=1

[meterLabelFree]
Meter=String
MeterStyle=styleLabel
X=10
Y=75
W=80
Text=Free:

[meterValueFree]
Meter=String
MeterStyle=styleValue
MeasureName=measureFree
X=270
Y=0r
W=180
Text=%1B
AutoScale=1
NumOfDecimals=1

[meterLabelTotal]
Meter=String
MeterStyle=styleLabel
X=10
Y=105
W=80
Text=Total:

[meterValueTotal]
Meter=String
MeterStyle=styleValue
MeasureName=measureTotal
X=270
Y=0r
W=180
Text=%1B
AutoScale=1
NumOfDecimals=1

[meterBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measurePercent
X=10
Y=140
W=260
H=8

[meterPercent]
Meter=String
MeterStyle=styleValue
MeasureName=measurePercent
X=270
Y=150
W=50
FontSize=12
Text=%1%
NumOfDecimals=0

