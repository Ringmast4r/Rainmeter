; IP Address Skin - Bloody Font
; Shows LAN and WAN IP addresses
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=IP Address - Bloody
Author=Anonymous
Information=Displays current IP addresses with Bloody font
Version=1.0.0

[Variables]
fontName=Bloody
textSize=14
colorText=255,50,50,255
colorLabel=180,0,0,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=50,0,0,100
FontColor=200,0,0,255
FontFace=#fontName#
FontSize=18
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=Consolas
FontSize=12
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=20,0,0,50
X=0
Y=0
W=280
H=110
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=5
W=280
Text=IP ADDRESS

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=40
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=270
Y=0r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=70
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=270
Y=0r
W=180
Text=%1

