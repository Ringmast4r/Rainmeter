[Rainmeter]
Update=1000
BackgroundMode=0
AccurateText=1
DynamicWindowSize=1
KeepOnScreen=0

[Metadata]
Name=Los Angeles Time Display
Author=Patrick Quirk
Information=Massive time display for Los Angeles PST timezone
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
timeSize=120
dateSize=36
labelSize=28
colorTime=60,59,110,255
colorDate=178,34,52,255
colorLabel=255,255,255,255
colorBackground=0,0,0,255

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureTime]
Measure=Time
TimeZone=-8
DaylightSavingTime=1
Format=%I:%M %p

[MeasureDate]
Measure=Time
TimeZone=-8
DaylightSavingTime=1
Format=%a, %b %d

[MeasureDay]
Measure=Time
TimeZone=-8
DaylightSavingTime=1
Format=%A

; ----------------------------------
; METERS
; ----------------------------------

[MeterLabel]
Meter=String
X=0
Y=0
FontFace=#fontName#
FontSize=#labelSize#
FontColor=#colorLabel#
StringAlign=Left
StringCase=Upper
AntiAlias=1
MeasureName=MeasureDay
StringStyle=Bold
Text=Los Angeles PST, %1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=8
FontFace=#fontName#
FontSize=#timeSize#
FontColor=#colorTime#
StringAlign=Left
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
Text=%1

