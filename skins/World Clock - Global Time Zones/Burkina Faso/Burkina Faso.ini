[Rainmeter]
Update=1000
BackgroundMode=0
AccurateText=1
DynamicWindowSize=1
KeepOnScreen=0

[Metadata]
Name=Burkina Faso Time Display
Author=Patrick Quirk
Information=Massive time display for Burkina Faso GMT timezone
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
timeSize=120
dateSize=36
labelSize=28
colorTime=0,158,73,255
colorDate=239,51,64,255
colorLabel=255,206,0,255
colorBackground=0,0,0,255

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureTime]
Measure=Time
TimeZone=0
DaylightSavingTime=0
Format=%I:%M %p

[MeasureDate]
Measure=Time
TimeZone=0
DaylightSavingTime=0
Format=%a, %b %d

[MeasureDay]
Measure=Time
TimeZone=0
DaylightSavingTime=0
Format=%A

; ----------------------------------
; METERS
; ----------------------------------

[MeterLabel]
Meter=String
X=0
Y=0
FontFace=#fontName#
FontSize=#labelSize#
FontColor=#colorLabel#
StringAlign=Left
StringCase=Upper
AntiAlias=1
MeasureName=MeasureDay
StringStyle=Bold
Text=Burkina Faso GMT, %1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=8
FontFace=#fontName#
FontSize=#timeSize#
FontColor=#colorTime#
StringAlign=Left
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
Text=%1

