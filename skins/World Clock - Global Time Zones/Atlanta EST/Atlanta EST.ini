[Rainmeter]
Update=1000
BackgroundMode=0
AccurateText=1
DynamicWindowSize=1
KeepOnScreen=0

[Metadata]
Name=Atlanta EST Time Display
Author=Patrick Quirk
Information=Massive time display for Atlanta EST timezone
License=Open Source
Version=1.0.0

[Variables]
fontName=Consolas
timeSize=120
dateSize=36
labelSize=28
colorTime=255,0,0,255
colorDate=200,0,0,255
colorLabel=255,50,50,255
colorBackground=0,0,0,255

; ----------------------------------
; MEASURES
; ----------------------------------

[MeasureTime]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%I:%M %p

[MeasureDate]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%a, %b %d

[MeasureDay]
Measure=Time
TimeZone=-5
DaylightSavingTime=1
Format=%A

; ----------------------------------
; METERS
; ----------------------------------

[MeterLabel]
Meter=String
X=0
Y=0
FontFace=#fontName#
FontSize=#labelSize#
FontColor=#colorLabel#
StringAlign=Left
StringCase=Upper
AntiAlias=1
MeasureName=MeasureDay
StringStyle=Bold
Text=Atlanta EST, %1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=0
Y=8
FontFace=#fontName#
FontSize=#timeSize#
FontColor=#colorTime#
StringAlign=Left
AntiAlias=1
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=255,0,0,50
Text=%1

