; IP Address Skin - Hit Me Punk Font
; Punk/Grunge style
; ----------------------------------

[Rainmeter]
Update=3000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=IP Address - Hit Me Punk
Author=Anonymous
Information=Displays current IP addresses with Hit Me Punk font
Version=1.0.0

[Variables]
fontName=Hit me, punk! 01
textSize=16
colorText=255,20,147,255
colorLabel=0,255,127,255

; ==================================
; MEASURES
; ==================================

[measureLAN]
Measure=Plugin
Plugin=SysInfo
SysInfoType=IP_ADDRESS
SysInfoData=Best

[measureWAN]
Measure=WebParser
URL=https://api.ipify.org/
UpdateRate=1
RegExp=(?s)^(.*)$
StringIndex=1
Substitute="":"Fetching..."

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
FontColor=255,255,0,255
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=30,30,30,220
X=0
Y=0
W=280
H=115
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterAccent1]
Meter=Image
SolidColor=255,20,147,255
X=0
Y=0
W=280
H=3

[meterAccent2]
Meter=Image
SolidColor=0,255,127,255
X=0
Y=112
W=280
H=3

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=IP ADDRESS

[meterLabelLAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=45
W=50
Text=LAN:

[meterValueLAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureLAN
X=270
Y=3r
W=180
Text=%1

[meterLabelWAN]
Meter=String
MeterStyle=styleLabel
X=10
Y=78
W=50
Text=WAN:

[meterValueWAN]
Meter=String
MeterStyle=styleValue
MeasureName=measureWAN
X=270
Y=3r
W=180
Text=%1

