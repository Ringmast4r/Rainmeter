; F Drive Storage Skin - Hit Me Punk Font
; Punk/Grunge style
; ----------------------------------

[Rainmeter]
Update=5000
DynamicWindowSize=1
AccurateText=1
SolidColor=0,0,0,200

[Metadata]
Name=F Drive Storage
Author=Anonymous
Information=Displays F Drive storage info
Version=1.0.0

[Variables]
fontName=Hit me, punk! 01
textSize=16
colorText=255,20,147,255
colorLabel=0,255,127,255
colorBar=255,20,147,255

; ==================================
; MEASURES
; ==================================

[measureTotal]
Measure=FreeDiskSpace
Drive=F:
Total=1
UpdateDivider=10

[measureUsed]
Measure=FreeDiskSpace
Drive=F:
InvertMeasure=1
UpdateDivider=10

[measureFree]
Measure=FreeDiskSpace
Drive=F:
UpdateDivider=10

[measurePercent]
Measure=Calc
Formula=(measureUsed / measureTotal) * 100
MinValue=0
MaxValue=100

; ==================================
; STYLES
; ==================================

[styleTitle]
StringAlign=Center
StringCase=Upper
StringStyle=Bold
StringEffect=Shadow
FontEffectColor=0,0,0,150
FontColor=255,255,0,255
FontFace=#fontName#
FontSize=20
AntiAlias=1

[styleLabel]
StringAlign=Left
StringStyle=Bold
FontColor=#colorLabel#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleValue]
StringAlign=Right
StringStyle=Bold
FontColor=#colorText#
FontFace=#fontName#
FontSize=#textSize#
AntiAlias=1

[styleBar]
BarColor=#colorBar#
BarOrientation=HORIZONTAL
SolidColor=255,255,255,30

; ==================================
; METERS
; ==================================

[meterBackground]
Meter=Image
SolidColor=30,30,30,220
X=0
Y=0
W=280
H=150
LeftMouseUpAction=[!Refresh]
ToolTipText=Click to refresh

[meterAccent1]
Meter=Image
SolidColor=255,20,147,255
X=0
Y=0
W=280
H=3

[meterAccent2]
Meter=Image
SolidColor=0,255,127,255
X=0
Y=147
W=280
H=3

[meterTitle]
Meter=String
MeterStyle=styleTitle
X=140
Y=8
W=280
Text=F: DRIVE

[meterLabelUsed]
Meter=String
MeterStyle=styleLabel
X=10
Y=45
W=80
Text=Used:

[meterValueUsed]
Meter=String
MeterStyle=styleValue
MeasureName=measureUsed
X=270
Y=0r
W=180
Text=%1B
AutoScale=1
NumOfDecimals=1

[meterLabelFree]
Meter=String
MeterStyle=styleLabel
X=10
Y=78
W=80
Text=Free:

[meterValueFree]
Meter=String
MeterStyle=styleValue
MeasureName=measureFree
X=270
Y=0r
W=180
Text=%1B
AutoScale=1
NumOfDecimals=1

[meterBar]
Meter=Bar
MeterStyle=styleBar
MeasureName=measurePercent
X=10
Y=115
W=260
H=8

[meterPercent]
Meter=String
MeterStyle=styleValue
MeasureName=measurePercent
X=270
Y=125
W=50
FontSize=12
Text=%1%
NumOfDecimals=0

