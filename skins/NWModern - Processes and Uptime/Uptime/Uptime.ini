; NWModern Uptime - "Sin City" house style (monochrome, Courier New, square
; corners, heavy black borders, black highlight blocks).
[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=0
ContextTitle=Open Task Manager
ContextAction=["taskmgr.exe"]

[Metadata]
Name=NWModern Uptime
Author=ringmast4r
Information=System uptime card in the Sin City monochrome house style: days, hours, minutes, seconds, day progress, boot time and total hours.
Version=2.0
License=Creative Commons BY-NC-SA 4.0

[Variables]
; Theme is toggled by the button in the top-right corner.
Theme=dark
@Include=#@#Themes\SinCity-#Theme#.inc
fMono=Courier New

; ================= styles
[sLabel]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
FontColor=#cMid#
AntiAlias=1

[sNum]
FontFace=#fMono#
FontSize=20
StringStyle=Bold
StringAlign=Center
FontColor=#cFg#
AntiAlias=1
Y=57

[sBoxLab]
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
StringAlign=Center
FontColor=#cMid#
AntiAlias=1
Y=92

[sValue]
FontFace=#fMono#
FontSize=8
StringStyle=Bold
FontColor=#cFg#
AntiAlias=1

; ================= measures
[mUp]
Measure=Uptime
Format=%4!i!d %3!02i!:%2!02i!:%1!02i!

[mHrsTotal]
Measure=Calc
Formula=mUp / 3600

[mDayPct]
Measure=Calc
Formula=(mUp % 86400) / 864
MinValue=0
MaxValue=100

[mScript]
Measure=Script
ScriptFile=#@#Scripts\Uptime.lua

; ================= card
[MCard]
Meter=Shape
Shape=Rectangle 1.5,1.5,337,197 | Fill Color #cBg# | StrokeWidth 3 | Stroke Color #cFg#

[MTitle]
Meter=String
FontFace=#fMono#
FontSize=11
StringStyle=Bold
StringCase=Upper
FontColor=#cFg#
AntiAlias=1
X=18
Y=15
Text=System Uptime

; hostname as a black badge (black background, white text)
[MHost]
Meter=String
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringCase=Upper
StringAlign=Right
FontColor=#cBg#
SolidColor=#cFg#
Padding=6,3,6,3
AntiAlias=1
X=268
Y=16
Text=

; theme toggle button (label names the mode it switches to)
[MToggle]
Meter=String
FontFace=#fMono#
FontSize=7
StringStyle=Bold
StringAlign=Right
FontColor=#cFg#
SolidColor=#cTrack#
Padding=6,3,6,3
AntiAlias=1
X=316
Y=16
Text=#ToggleLabel#
LeftMouseUpAction=[!WriteKeyValue Variables Theme #ToggleTo#][!Refresh]
MouseActionCursorName=Hand
ToolTipText=Switch to #ToggleTo# mode

; ================= stat boxes
[MFrame]
Meter=Shape
; header underline 3px
Shape=Rectangle 18,38,304,3 | Fill Color #cFg# | StrokeWidth 0
; DAYS box is the highlight block (black fill)
Shape2=Rectangle 18,50,70,62 | Fill Color #cFg# | StrokeWidth 0
Shape3=Rectangle 97,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
Shape4=Rectangle 175,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
Shape5=Rectangle 253,51,68,60 | Fill Color #cBg# | StrokeWidth 2 | Stroke Color #cFg#
; day-progress track
Shape6=Rectangle 18.5,138.5,303,9 | Fill Color #cTrack# | StrokeWidth 1 | Stroke Color #cFg#
; footer rule 2px
Shape7=Rectangle 18,158,304,2 | Fill Color #cFg# | StrokeWidth 0

[MDays]
Meter=String
MeterStyle=sNum
X=53
FontColor=#cBg#
Text=--

[MDaysL]
Meter=String
MeterStyle=sBoxLab
X=53
FontColor=#cHiLab#
Text=Days

[MHours]
Meter=String
MeterStyle=sNum
X=131
Text=--

[MHoursL]
Meter=String
MeterStyle=sBoxLab
X=131
Text=Hours

[MMins]
Meter=String
MeterStyle=sNum
X=209
Text=--

[MMinsL]
Meter=String
MeterStyle=sBoxLab
X=209
Text=Mins

[MSecs]
Meter=String
MeterStyle=sNum
X=287
Text=--

[MSecsL]
Meter=String
MeterStyle=sBoxLab
X=287
Text=Secs

; ================= day progress
[MDayLab]
Meter=String
MeterStyle=sLabel
X=18
Y=124
Text=// Day progress

[MDayPct]
Meter=String
MeterStyle=sLabel
StringAlign=Right
FontColor=#cFg#
X=322
Y=124
Text=--

[MDayBar]
Meter=Bar
MeasureName=mDayPct
X=20
Y=140
W=300
H=6
BarColor=#cFg#
BarOrientation=Horizontal
ToolTipText=Progress through the current day of uptime

; ================= footer
[MBootLab]
Meter=String
MeterStyle=sLabel
X=18
Y=167
Text=Booted

[MBootValue]
Meter=String
MeterStyle=sValue
X=18
Y=179
Text=--

[MTotalLab]
Meter=String
MeterStyle=sLabel
StringAlign=Right
X=322
Y=167
Text=Total

[MTotalValue]
Meter=String
MeterStyle=sValue
MeasureName=mHrsTotal
NumOfDecimals=1
StringAlign=Right
X=322
Y=179
Text=%1 HRS
